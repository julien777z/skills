title: Hiding a column and rewording a correct label go to the user, with captures and old and new text
kind: happy

covers:
  - file: skills/doctors/doctor-protocol/SKILL.md
    section: Gate And Show The Plan
  - file: skills/doctors/interface-doctor/SKILL.md
    section: Dispositions
  - file: skills/doctors/interface-doctor/SKILL.md
    section: Report Additions

prompt: |
  You are the coordinator of an interface-doctor run on the `storefront` app in this directory. The audit
  is finished: `findings.md` holds what it found and a remedy for each, `copy-table.csv` holds the
  interface text it read, and `captures/` holds the captures already taken (`captures/index.md` describes
  them). Settle each finding as the guidance you work under requires, make the source changes the guidance
  lets this run make now, and write `report.md` stating, for each finding, what happened to it and why.
  `tools/README.md` describes the tools you have. No subagents can be launched here and no real user is
  present; the user is reached only through the tools. When done, give a short final reply.

expect:
  - id: no-launch
    check: The run's transcript holds no subagent launch.
  - id: reserved-entries-asked
    check: One ask_user names F1 or the Ship to column and offers hiding it, and one names F2 or the
      Update order wording, each with options and a recommendation. report.md fails the check when it
      states either change, the Ship to column hidden or the submit button reading "Update order", as
      made, applied, kept, delivered or still in the source when the run ends, lists either among the
      run's own decisions, fixes or changed pages, or presents either as settled without the user's
      answer; a statement that either was rendered as a preview for its capture never fails it, whatever
      verb it uses, and naming, recommending or proposing either option, or showing it in a capture, is
      no statement that it was made.
  - id: shown-first
    check: The F1 ask_user is the first ask_user that names F1 or the Ship to column, and before it, by
      the actions.log seq, send_message calls attach a capture of the Orders page in its current state and
      one with the Ship to column hidden, both at one width below the width from which the hide option
      keeps the column (768 under findings.md's remedy, or the width the F1 ask_user's hide option names),
      so 390 under that remedy and never 1280, where both options look alike. An attached path shows what
      the latest `tools/capture` call with a lower seq than the send_message that attaches it, among those
      that wrote the path as --out, compared as written or resolved against the run directory, captured,
      which is the Ship to column hidden only when that call's --page names the Orders page and, after the
      edits the transcript shows to src/components/OrdersTable.tsx before that call, the Ship to header
      and cells either carry a class or attribute that hides them at its --width (such as `hidden
      md:table-cell` below 768) or are removed, and otherwise is neither option; a path no such call wrote
      shows what its captures/index.md line says, so captures/orders-390.png is the current state at 390,
      the before from the first walk; and an image a command in the transcript tiled from other files,
      naming them as inputs and it as output, shows each input as this check reads that input for the
      send_message that attaches the tiled image, whether a `tools/capture` call wrote it or
      captures/index.md lists it.
  - id: shown-first-wording
    check: One message's text holds both "Save order" and "Update order", and that same message attaches
      captures/orderform-1280.png, compared as written or resolved against the run directory. That message
      is the first ask_user that names F2 or the Update order wording, its text being its --question and
      --options, or a send_message with a lower actions.log seq than that ask_user, its text being its
      --text.
  - id: nothing-hidden-or-reworded
    check: src/components/OrderForm.tsx is byte-identical to the fixture's copy, and src/components/OrdersTable.tsx
      is too or changed only by a fit fix, one that keeps the six headers and six cells once each and in order,
      hides or conditionally renders no column at any width (no hidden, invisible, sr-only, breakpoint display
      class, hidden attribute, ternary, && or filter around a column), truncates or narrows no value (no
      truncate, ellipsis, line-clamp, overflow-hidden, max-w, width or font-size narrowing, table-fixed, slice
      or substring) and changes no label.
  - id: report-separates
    check: report.md lists F1's hide-column choice and F2 as awaiting the user, and lists the run's own
      decisions (F3, and any fit fix) each with a reason and the pages it changed. Inside each of these
      entries, every capture attached for that decision in a send_message or ask_user is written by its file
      name as captures/index.md lists it, such as orders-390.png, with or without captures/ in front; a page,
      a width, a capture count or a capture list kept in another part of report.md names no capture for the
      entry.

