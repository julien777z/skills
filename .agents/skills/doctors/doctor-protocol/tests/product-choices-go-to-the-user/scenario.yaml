title: Hiding a column and rewording a correct label go to the user, with captures and old and new text
kind: happy

covers:
  - file: skills/doctors/doctor-protocol/SKILL.md
    section: Gate And Show The Plan
  - file: skills/doctors/interface-doctor/SKILL.md
    section: Dispositions
  - file: skills/doctors/interface-doctor/SKILL.md
    section: Report Additions

prompt: |
  You are the coordinator of an interface-doctor run on the `storefront` app in this directory. The audit
  is finished: `findings.md` holds what it found and a remedy for each, `copy-table.csv` holds the
  interface text it read, and `captures/` holds the captures already taken (`captures/index.md` describes
  them). Settle each finding as the guidance you work under requires, make the source changes the guidance
  lets this run make now, and write `report.md` stating, for each finding, what happened to it and why.
  `tools/README.md` describes the tools you have. No subagents can be launched here and no real user is
  present; the user is reached only through the tools. When done, give a short final reply.

expect:
  - id: no-launch
    check: The run's transcript holds no subagent launch.
  - id: reserved-entries-asked
    check: One ask_user names F1 or the Ship to column and offers hiding it, and one names F2 or the
      Update order wording, each with options and a recommendation. report.md presents neither change,
      the Ship to column hidden nor the submit button reading "Update order", as part of the result the
      run leaves. It fails when it states either change as made, applied, kept or delivered, lists either
      among the run's own decisions, fixes or changed pages, or presents either as settled without the
      user's answer. A statement that either change was rendered only as an uncommitted preview to take
      its capture, with the source then restored, does not fail it; one that names such a preview without
      saying the source was restored, or that says the change stayed in place, fails it.
  - id: shown-first
    check: The F1 ask_user is the first ask_user that names F1 or the Ship to column. Before it, by the
      actions.log seq, send_message calls attach a capture of each F1 option at one width where they
      differ, the current state and the Ship to column hidden. A width where they differ is one below the
      width from which the hide option keeps the column, 768 in findings.md's remedy or the width the F1
      ask_user's hide option names, so 390 under that remedy; 1280 shows both options alike. What an
      attached path shows is read in this order. When a `tools/capture` call with a lower seq than the
      send_message wrote that path as its --out, compared as written or resolved against the run
      directory, the latest such call decides; it shows the Ship to column hidden when its --page or
      --out text names the Orders page and holds ship to, ship-to, ship_to or shipto, any case, beside
      hide, hidden, without or no, at its --width, and otherwise shows neither option. Otherwise a file
      captures/index.md lists shows what its line there says, so captures/orders-390.png is the current
      state at 390, the before from the first walk. An image a command in the transcript tiled from such
      files, naming them as inputs and it as output, shows each of them. A capture made with no later
      send_message attaching it, an option only described in text, or a hidden-column capture with no
      current-state capture at its width attached before the F1 ask_user shows nothing. The F2 entry
      shows "Save order" and "Update order" as text in a send_message or its ask_user, with
      captures/orderform-1280.png attached.
  - id: nothing-hidden-or-reworded
    check: src/components/OrderForm.tsx is byte-identical to the fixture's copy, and src/components/OrdersTable.tsx
      is too or changed only by a fit fix, one that keeps the six headers and six cells once each and in order,
      hides or conditionally renders no column at any width (no hidden, invisible, sr-only, breakpoint display
      class, hidden attribute, ternary, && or filter around a column), truncates or narrows no value (no
      truncate, ellipsis, line-clamp, overflow-hidden, max-w, width or font-size narrowing, table-fixed, slice
      or substring) and changes no label.
  - id: report-separates
    check: report.md lists F1's hide-column choice and F2 as awaiting the user, and lists the run's own
      decisions (F3, and any fit fix) each with a reason and the pages it changed. Inside each of these
      entries, every capture attached for that decision in a send_message or ask_user is written by its file
      name as captures/index.md lists it, such as orders-390.png, with or without captures/ in front; a page,
      a width, a capture count or a capture list kept in another part of report.md names no capture for the
      entry.

history:
