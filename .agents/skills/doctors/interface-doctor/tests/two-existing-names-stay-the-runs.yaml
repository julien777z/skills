schema: pinned-scenario/2
id: interface-doctor/two-existing-names-stay-the-runs
kind: edge
title: Choosing between two existing names for one thing stays the run's call, even near an even split

pins:
  - file: skills/doctors/interface-doctor/SKILL.md
    section: Dispositions
    holds: "item 6's second list: which of two names for one thing wins stays the run's, through council
      where its checks cannot settle it"
  - file: skills/doctors/doctor-protocol/SKILL.md
    section: Gate And Show The Plan
    holds: the run decides every call apart from the reserved entries, and the report says which it made

