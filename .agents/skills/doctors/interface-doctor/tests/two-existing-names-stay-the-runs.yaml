situation: >
  An interface-doctor run has one verified finding: the same record is called "Customer" on 8 pages and
  "Client" on 7, both correct, with no rule, glossary or shared component behind either. The near-even
  split sits beside the reserved entry for two evenly used drawings of one shape, which a reader could
  stretch to cover names. Names are not drawings: the choice is the run's.

