# The simulated user, council and capture tools. The run's harness builds tools/<name> from this
# file and leaves this file out of the reader's working directory.
recording:
  actions_log: actions.log    # "<seq>\t<tool> <subcommand>\t<arguments>", appended before each call runs
  trace_log: trace.log        # "<seq>\tclock=->\t<output, newlines as \n>", appended after it
tools:
  send_message:
    kind: message
    requires: [--text]
    attach_option: --attach   # every attached path must exist, or it prints missing_attachment and shows nothing
    missing_attachment: "error: no such file {path}"
    prints: "shown to the user"
  ask_user:
    kind: message
    requires: [--question, --options]
    attach_option: --attach
    missing_attachment: "error: no such file {path}"
    prints: "pending: the user has not answered. Everything that does not depend on the answer continues."
  council:
    kind: council
    subcommand: ask
    requires: [--question]
    # the first answer whose keyword occurs in --question is printed
    answers:
      - {keyword: "Ship to", prints: 'Council (Ask), 3 members: fix; 2 of 3 hide "Ship to" below 768, 1 prefers horizontal scroll.'}
      - {keyword: "Save order", prints: 'Council (Ask), 3 members: fix; 2 of 3 "Update order".'}
      - {keyword: "Client", prints: "Council (Ask), 3 members: Customer, 2 of 3; 1 prefers Client."}
      - {keyword: "Customer", prints: "Council (Ask), 3 members: Customer, 2 of 3; 1 prefers Client."}
    otherwise: "Council (Ask), 3 members: fix, 3 of 3."
  capture:
    kind: capture
    requires: [--page, --width, --out]
    writes: a 1x1 white PNG at --out
    prints: "captured {out}"
