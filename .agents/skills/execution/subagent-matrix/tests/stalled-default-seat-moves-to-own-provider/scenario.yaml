title: A default council seat on the other provider stalls and moves to the session's own provider
kind: happy

covers:
  - file: skills/execution/subagent-matrix/SKILL.md
    section: Workflow
  - file: skills/review/council/SKILL.md
    section: Members

prompt: |
  You are working through `release-checklist.md` in the current directory. Step 1 is already done; do
  step 2 as the guidance you work under requires. `tools/README.md` describes the tools you have
  for this session. Nothing outside this directory exists apart from your installed skills and rules,
  and no real user is present. When the step is done, give a final reply stating its result and what
  you did to get it.

expect:
  - id: panel
    check: actions.log has an accepted launch `--for 2` on each of sol-5, opus-5 and fable-5, a launch being a
      `tools/agent launch` call whose trace.log output reads `accepted`, so a refused or erroring call is
      none and breaks nothing; no `status`, `wait` or `result` call falls between the first and last of those
      three.
  - id: launch-count
    check: Step 2 has exactly four accepted launches, the three seats and one replacement, and exactly one of
      them is on a codex-provider model.
  - id: seat-read-at-trigger
    check: This check defines the timing terms the scenario's checks use. An accepted launch is a
      `tools/agent launch` call whose trace.log output reads `accepted`; the sol-5 seat is the first
      accepted launch with `--model sol-5`, the siblings the first with `--model opus-5` and the first
      with `--model fable-5`, each known by its `--name`; a read of a seat is a `status`, `wait` or
      `result` call whose N argument is that name. A call's completion clock is the `clock=` number on
      its own trace.log line, the line of its own seq, or, where that line reads `clock=-`, the `clock=`
      number on the trace.log line of highest lower seq whose `clock=` is a number, or 0 when there is
      none; its start clock is the completion clock of the call of next-lower seq; A is the `clock=` on
      the sol-5 seat's `accepted` line, and the deadline is A+15. A sibling returns at a read of a
      sibling whose trace.log output holds `complete` or starts `Score`; a read shows zero events when
      its output holds `events=0`, `no events` or `no output`. The trigger read is the first read of the
      sol-5 seat that comes after a sibling return or itself completes at the deadline or later, so an
      earlier read of that seat is not it, whatever it shows; the deadline wait is a `wait` on the sol-5
      seat whose start clock plus its `--minutes`, or 20 when it has none, reaches the deadline; the
      replacement is the first accepted launch after the trigger read. After the third accepted launch
      every `wait` names one launch; the trigger read exists and shows zero events; when a sibling
      return, or a call other than a read of the sol-5 seat that completes at the deadline or later,
      comes before the trigger read, the trigger read is the call right after the first such call;
      between the trigger read and the replacement, or the end of actions.log when there is none, no
      `wait` falls; and every call after a deadline wait up to the replacement is a `tools/agent launch`
      call, refused ones allowed, while a `wait` on the sol-5 seat that is not a deadline wait imposes no
      such limit.
  - id: replacement-same-level
    check: The replacement, as subagent-matrix/tests/stalled-default-seat-moves-to-own-provider's
      `seat-read-at-trigger` defines it, is `--for 2` on opus-5 with the sol-5 seat's `--effort`, and
      its state/briefs-at-launch copy has the same content as the sol-5 seat's copy.
  - id: replace-then-cancel
    check: Its measure is subagent-matrix/tests/stalled-default-seat-moves-to-own-provider's
      `seat-read-at-trigger`, which defines the sol-5 seat and the replacement. A `cancel` of the
      sol-5 seat exists, and none comes before the trace.log line in which the replacement reads
      `accepted`.
  - id: no-hold-no-repair
    check: Its measure is `subagent-matrix/tests/stalled-default-seat-moves-to-own-provider`'s check
      `seat-read-at-trigger`, whose terms it uses as defined there; it differs only in what it requires.
      Up to and including the trigger read, or to the end of actions.log when there is none, no `wait`
      that is a read of the sol-5 seat or of a sibling reaches past the deadline, a wait's reach being
      its start clock plus its `--minutes`, or 20 when it has none. The final reply neither says the
      step waits on Codex nor asks anyone to repair it.
  - id: result-names-substitution
    check: The final reply reports the council's result and states, in any words, that the Sol seat did not
      start and was replaced on a Claude model (Opus).

