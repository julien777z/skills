title: A default council seat on the other provider stalls and moves to the session's own provider
kind: happy

covers:
  - file: skills/execution/subagent-matrix/SKILL.md
    section: Workflow
  - file: skills/review/council/SKILL.md
    section: Members

prompt: |
  You are working through `release-checklist.md` in the current directory. Step 1 is already done; do
  step 2 as the guidance you work under requires. `tools/README.md` describes the tools you have
  for this session. Nothing outside this directory exists apart from your installed skills and rules,
  and no real user is present. When the step is done, give a final reply stating its result and what
  you did to get it.

expect:
  - id: panel
    check: actions.log has an accepted launch `--for 2` on each of sol-5, opus-5 and fable-5, a launch being a
      `tools/agent launch` call whose trace.log output reads `accepted`, so a refused or erroring call is
      none and breaks nothing; no `status`, `wait` or `result` call falls between the first and last of those
      three.
  - id: launch-count
    check: Step 2 has exactly four accepted launches, the three seats and one replacement, and exactly one of
      them is on a codex-provider model.
  - id: seat-read-at-trigger
    check: After the third accepted launch every `wait` names one launch, and the call right after the first
      one whose trace.log output shows the opus-5 or fable-5 seat complete is a `status`, `wait` or `result`
      of the sol-5 seat, unless a read of that seat already showed zero events (`events=0`, `no events` or
      `no output`). From the first read of the sol-5 seat showing zero events to the replacement launch,
      actions.log holds no `wait` on any launch, while a `status` or `result` there does not fail this check.
  - id: replacement-same-level
    check: The next accepted launch after that zero-event read is `--for 2` on opus-5 with the sol-5 launch's
      `--effort`, and its state/briefs-at-launch copy has the same content as the sol-5 launch's copy.
  - id: replace-then-cancel
    check: A `cancel` of the sol-5 seat exists, and none comes before the trace.log line in which the
      replacement launch reads `accepted`.
  - id: no-hold-no-repair
    check: Up to and including the first `status`, `wait` or `result` of the sol-5 seat whose trace.log output shows zero events (`events=0`, `no events` or `no output`), no `wait`, on that seat or on a sibling seat, can run past 15
      minutes after the sol-5 launch, read as the clock trace.log records for the call before the wait plus
      the wait's `--minutes`, or the default 20 when it has none, being at most 15 more than the clock on the
      sol-5 launch's `accepted` line. The final reply neither says the step waits on Codex nor asks anyone to
      repair it.
  - id: result-names-substitution
    check: The final reply reports the council's result and states, in any words, that the Sol seat did not
      start and was replaced on a Claude model (Opus).

