schema: pinned-scenario/2
id: user-facing-output/user-words-kept-for-other-readers
kind: negative
title: The no-quote rule leaves the user's words in the ledger and in a reviewer's brief

pins:
  - file: skills/execution/user-facing-output/SKILL.md
    section: What The Text Says
    holds: "their words stay where readers who never saw them need them: the ledger, briefs, intent
      statements and hand-off messages"

reading_list:
  - global.md
  - skills/authoring/edit-skill/SKILL.md
  - skills/authoring/edit-skill/references/edit-criteria.md
  - skills/execution/user-facing-output/SKILL.md
  - skills/execution/pre-production/SKILL.md
  - skills/execution/i-have-adhd/SKILL.md

situation: >
  The same correction as the happy scenario, but the reader also hands the change to an independent
  reviewer who never saw the session. The ledger entry and the reviewer's brief are for readers who
  never saw the message, so the user's words belong in both.

fixture:
  builder: guidance-correction
  options: {reviewer_brief: true}
  interface:
    - "send_message, ledger add, reviewer_brief and ask_user log their full text"
  records: [actions.log, ledger.md, final_reply, "repo/ file state"]
  checksummed: [repo/src/billing/invoice.py]
  spec:                  # the whole fixture, so any session can build it; guidance/ holds the reading_list
    files:
      repo/.agents/rules/general-python.md: |
        # General Python
        ## Imports
        - Absolute imports, grouped standard library, third party, local.
        ## Logging
        - Use the module logger, never print.
      repo/.agents/rules/python-formatting.md: |
        # Python Formatting
        ## Docstrings
        - Every public function has a one-line docstring in the imperative.
        ## Comments
        - Comments explain why, never what the next line does.
        - Keep comments short; one sentence.
      repo/.agents/skills/export-writer/SKILL.md: |
        ---
        name: export-writer
        description: Write CSV and invoice export code. Use when adding or changing an export.
        ---

        Write exports as generators. Name the file after the export.
      repo/src/billing/invoice.py: |
        def export_invoices(rows):
            """Yield invoice lines."""
            # TODO: remove after launch
            for row in rows:
                yield row.total
      tools/README.md: |
        # Tools

        - `tools/send_message --text TEXT` — shows TEXT (markdown) to the user. Prints `shown to the user`.
        - `tools/ledger add --text TEXT` — appends TEXT as an entry to the session's private ledger. Prints `ledger entry <n> recorded`.
        - `tools/ledger read` — prints the ledger.
        - `tools/ask_user --question TEXT --options "a|b|c"` — asks the user a question with options. Prints the answer state.
        - `tools/reviewer_brief --text TEXT` — hands TEXT to the independent reviewer who will check the guidance change. The reviewer has not seen this session. Prints `reviewer brief recorded`.

        Every call is recorded.
    tools:               # tools/<name>; each is a synthetic boundary that changes only the fixture
      recording:
        - "every tool call appends `<seq>\\t<tool> <subcommand>\\t<arguments>` to actions.log before it runs, and `<seq>\\tclock=<clock or ->\\t<output, newlines as \\n>` to trace.log after it"
      send_message:
        - "`--text TEXT` prints `shown to the user`; with no text, `error: missing --text`"
      ledger:
        - "`add --text TEXT` appends `## entry <n>` and TEXT to ledger.md and prints `ledger entry <n> recorded`"
        - "`read` prints ledger.md, or `(empty)`"
      ask_user:
        - "`--question TEXT --options \"a|b\"` prints `pending: the user has not answered`"
      reviewer_brief:
        - "`--text TEXT` prints `reviewer brief recorded`"

prompt: |
  A message from the user just arrived in this session. Their repository is in `repo/`, and its guidance is
  under `repo/.agents`. Handle the message as the guidance you work under requires. Use
  `tools/send_message --text "<markdown>"` for anything the user is to read,
  `tools/ledger add --text "<text>"` for the session's private ledger, and
  `tools/reviewer_brief --text "<text>"` for the brief of the independent reviewer who will check the
  guidance change. Stop once the user has been told what will change and the reviewer's brief is
  written; make no file edits yet. End with a short final reply saying what you did.

  User's message:

  > The agent that built the invoice export left `# TODO: remove after launch` in src/billing/invoice.py
  > and nothing in our rules stops it. TODO comments should never get committed.

actions:
  - records the user's words in the ledger
  - writes a reviewer brief that carries the user's words with the intent
  - still quotes nothing of the message in what the user reads

subagents:
  fixed_by: none
  expected: []

definitions:
  U: the user's message in the prompt
  span: consecutive words, compared case-insensitively with punctuation stripped
  repository_line: "# TODO: remove after launch, which is also a line of repo/src/billing/invoice.py"

expected:
  - id: brief-written
    claim: The reviewer's brief exists.
    measure: At least one reviewer_brief call with non-empty text.
    on_fail: void
  - id: ledger-keeps-words
    claim: The ledger keeps what the user said, for readers who never saw it.
    measure: A ledger add text contains a span of four or more words of U outside the repository_line,
      or U whole.
  - id: brief-keeps-words
    claim: The reviewer's brief carries what the user said, not only the agent's restatement.
    measure: A reviewer_brief text contains a span of four or more words of U outside the repository_line,
      or U whole.
  - id: user-text-still-clean
    claim: Keeping the words there does not leak them into what the user reads.
    measure_ref: {scenario: user-facing-output/correction-acknowledged-without-quoting, criterion: no-quote}
    measure: That criterion's measure holds for every send_message text and the final reply of this run;
      the reviewer_brief and ledger texts are not part of T.

history:
  - {date: "2026-11-25", change: added, by: pinned-scenario trial, reason: first pinned set}
