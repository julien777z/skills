    genre_exceptions:
        - genre: "Obby / platformer"
          game_ids: ["7729422550"]
          note: "No tutorial, marker or legend; colour alone separates hazard from course; failure is unexplained; progress is pure movement mastery and is felt as the world growing. A skilled player finds stage 1 in 7 s while real play stayed at stage 0 for 24 minutes, so the banner-and-trail onboarding norm does not hold here."
          evidence_ids: ["7729422550:play_1", "7729422550:video_1"]
        - genre: "Social roleplay and creative sandboxes"
          game_ids: ["1686885941", "7104927007", "2711375305", "4723764956"]
          note: "No goal ladder, currency progression or quest banner; play is self-directed expression shown to others (an owner's name on a plot sign, character performances, outfits copied from other players, a premiere on a shared screen). Goal and locked-content patterns do not apply; onboarding is light (HUD labels) or peer-taught."
          evidence_ids: ["1686885941:source_4", "7104927007:video_1", "7104927007:video_2", "2711375305:video_1", "4723764956:video_session_1"]
        - genre: "Narrative point-and-click"
          game_ids: ["10771871836"]
          note: "Guidance is deliberately sparse (one 'POINT & CLICK' caption, rare nudges); the next beat can stall a player for many minutes; replay value comes from an endings album that becomes a free hint list after the first ending."
          evidence_ids: ["10771871836:play_1", "10771871836:video_session_1"]
        - genre: "PvP fighting and shooters"
          game_ids: ["3508322461", "5995470825", "9867225552"]
          note: "Progress is mostly mastery of a small control set rather than stat growth; onboarding was indeterminate in all three; newcomers learn controls from peers; group targeting of lone players is the main friction."
          evidence_ids: ["3508322461:source_4", "3508322461:source_5", "5995470825:video_1", "9867225552:video_1"]
        - genre: "Wave defense / tower defense with a gacha meta"
          game_ids: ["3183403065", "6375110339"]
          note: "Both put meta systems (update log, daily login, quests, gacha banners) before the first match, and real play reached the first wave late or mid-run (joined at wave 73). This is the strongest case of the join-modal pattern, not a separate genre rule."
          evidence_ids: ["3183403065:play_1", "6375110339:play_1"]
        - genre: "Asymmetric round survival"
          game_ids: ["6026405541", "6331902150", "10771743491"]
          note: "Round goals fit one line per role with a hard timer and a single objective line with a count; play needs a full server. Only 6026405541 has footage (a trailer); the other two are description and art only."
          evidence_ids: ["6026405541:source_3", "6331902150:description_1", "10771743491:source_2"]
        - genre: "Physics sandbox"
          game_ids: ["10770575733"]
          note: "Advertised with every tool free from the start and no progression; no footage, so nothing is claimed beyond the description."
          evidence_ids: ["10770575733:api_1"]
    evidence_limits:
        - "Five games have no gameplay video and are partial: 10747710159 (Word Battle!), 10770575733 (Ragdoll Physics), 10771743491 (South Hell), 6331902150 (Forsaken), 4260784961 (Napoleonic Wars). They count as unknown, never as evidence against a pattern, and appear only in eligible counts where their description or art is relevant."
        - "The VM's GPU garbled several 3D worlds in real play (notably 994732206 and 3183403065, and parts of 1686885941); videos confirm those were VM faults, not game art. World-readability and navigation claims from those sessions rest on video."
        - "Agent input was slow and imprecise (a failed mouse-hold in 10772543706, a D-key defect in 7529591378, blind movement in 5995470825), so play-based difficulty, feel, stall-length and accidental-purchase claims are weak; UI presence and ordering from captures are reliable."
        - "Videos are edited and usually from returning or skilled players; no tutorial duration or session length is taken from them, and creators' confusion may be performed for an audience."
        - "The first games were played under a five-minute active-play limit; later games ran longer, so observed_seconds are not comparable across games."
        - "Creator preview trailers (e.g. 1686885941, 2711375305, 5174979552, 6026405541) are promotional montages; they establish presentation, not first-time flow."
        - "Font sizes are visual estimates from scaled captures except 7729422550; touch and gamepad were seen only in footage, never operated."
        - "Chart presence is correlation: no pattern here is claimed to cause popularity, retention or spending."
