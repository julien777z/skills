          evidence_ids: ["10209534490:source_3", "10209534490:source_4", "10209534490:source_5", "10563114921:video_1", "10563114921:video_3", "10772543706:yt_onboarding_1", "10772543706:yt_skilled_1", "3359505957:play_1", "3359505957:video_1", "994732206:video_1"]
          observed_count: 5
          eligible_count: 8
          confidence: medium
          limitations:
              - "Eligible: games with an earn-and-spend economy whose first session was seen in play or first-session footage; the three non-supporting games (3183403065, 6375110339, 7529591378) put modals, meta menus or a drill tutorial before the first spend."
              - "Videos are edited, so no cycle duration is measured; only the order of steps is relied on."
              - "Real play did not complete the cycle in 10563114921 (arrows never reached), 10772543706 (runner mouse-hold failed) or 994732206 (world garbled by the VM GPU); videos supply the cycle for those."
        - pattern: "Locked and undiscovered content is shown in place with its unlock condition: silhouetted '???' collection entries, padlocked slots, greyed moves with the level that unlocks them, locked modes with a win count, priced locked items, and endings albums with unfound names."
