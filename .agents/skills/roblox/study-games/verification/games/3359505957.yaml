gameplay:
  advertised_loop: "Hatch eggs for pets, fuse duplicates into higher rarities, collect 200+ pets, unlock areas with upgrades, complete quests and badges."
  observed_loop: "Play (play_1): hatch a free starter egg, the pet auto-equips, stand in a crystal field where equipped pets mine gold passively, a quest bar fills, claim the quest's egg reward and hatch it into a new pet. Videos: the same loop continues with gold spent on in-world upgrade pads (a damage wall, then many named multipliers), new pets found from quest eggs and hidden eggs, duplicates fused, and pet-count gates (15 pets for The Forest, 40 for the Desert) opening the next area (video_1); the late game layers a Lab, shiny skins, badges and ascension resets on top (video_2, video_3)."
  first_action: "Click 'Hatch Egg' on the welcome modal."
  first_success_seconds: 31
  success_feedback: ["Large floating pet name over each newly found pet and a big paw counter flash (video_1 3:45)", "Upgrade pad shows the bought effect, e.g. '+1% Damage' with cost and new total (video_1 1:15)", "Full-screen pet reveal: large pet name, rarity label, '+1' with a portrait card and 'New Pet Discovered!' heading, paw counter ticking up", "Gold counter climbing with a per-second rate", "Quest bar turning green with a check and a pink 'You completed a quest! Claim your reward' callout with an arrow pointing at the reward"]
  progression: ["Pet-count gates shown as huge paw numbers in the world: 15 to enter The Forest, 40 to enter the Desert (video_1 3:45, captions)", "Gold-bought world pads: damage wall '+1% Damage' at rising costs, +1 pet equip slot for 25K gold (video_1)", "Late: Lab research grid, shiny skins kept across rebirths, metallic and giant pets, badges per score track, ascension (video_2, video_3)", "Pet count (paw) and collection counter 1/240 at left", "Gold with rate (0/s, 4/s, 14/s observed)", "Equip slots: 4 open of 12, 8 locked", "Total Damage stat from equipped pets", "Sign: an Uncommon egg every hour once Total Pet Score reaches 15"]
  choices_and_variety: ["Which pad to buy next: damage, equip slot, magnet, drop rate and many later multipliers (video_1, video_2)", "Solo versus crowded server changes which upgrades matter (video_2 captions)", "Equip vs Fuse tabs in the Pets panel", "Equip Best button", "Filter in the pet list", "Zone label 'The Meadow' with a pointer icon"]
  social_and_cooperative: ["Top-right leaderboard of pet score and collection progress", "Friends Bonus: gold multiplier x1.3 with three friends in the server (video_1 0:30, video_2 captions)", "Players can collect the gold drops other players' pets knock loose, so stronger players nearby raise a newcomer's income (video_1 captions; video_2 recommends full 12-player servers)"]
  companions_and_pets: ["Pets follow the player and mine crystals for gold; pet power shown as damage", "A button locks pets to an area so they keep mining while the player goes elsewhere (video_1 9:00)", "Shiny skins: 1 in 1,000 per hatch or fuse, kept through rebirth, +80% damage (video_3 0:15)"]
  friction:
    - "Nothing said where to go after the first hatch: logs near spawn did nothing when clicked, and the earning crystal field was found by wandering."
    - "Another player's very large dark avatar or accessory sat at the camera focus and covered the view of the character (3359505957-4.png onward)."
    - "Videos: early play involves a lot of running to collect gold drops by hand until magnet upgrades arrive; the video_1 creator called the start slow (captions)."
    - "Videos: a settings checkbox must stay unchecked early or hatched pets give no collection credit, explained only by the creator (video_1 captions)."
    - "Videos: late-game upgrades are explained by formulas such as 'x(1 + Exotic Crystal Score / 100,000,000)' in floating captions (video_2 0:45), dense for a casual player."
  evidence: [api_1, play_1, video_1, video_2, video_3]
