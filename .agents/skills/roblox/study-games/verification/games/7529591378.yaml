transferable_ideas:
    - "Announce the tutorial's length up front ('about 1 minute') and show 'Step N of 3' so a new player knows the cost."
    - "Teach each verb with one immediate, worded verdict ('Perfect Release', 'So close - get right next to them') and a small retry budget."
    - "End the tutorial with a reward and a single choice between the real competitive mode and the hub."
    - "Forgiving streak ('Missed a day? Your streak waits for you') with all seven rewards previewed."
    - "A live letter grade during a match (D to B+) tells a beginner how they are playing while the score is still close (yt_onboarding_1 6:30-9:45)."
    - "Queue for a match by standing on a court spot in a shared park, so finding a game is spatial and visible to others (yt_session_1 14:00); needs a visible 'waiting for players' state, which the creator lacked."
    - "End the tutorial with a short first-to-7 game against AI and a box score before the open world (yt_onboarding_1 2:00-2:45)."
practical_takeaway:
    strongest_idea: "A step-counted verb tutorial with worded per-action verdicts that ends in a short first-to-7 game against AI, then carries the same verdicts and a live letter grade into real matches, so feedback the beginner learned keeps working."
    main_tradeoff: "Depth sits in builds, badges and per-move animations that even a large creator needed outside guides to understand, and how to join a park game was unclear; play_1 also found faint tutorial text and a chained daily reward and 48-hour offer on reaching the hub."
    suitable_genres_and_stages: ["sports", "competitive action", "any game with a few core verbs", "first session"]
    testable_hypothesis: "Adding an explicit length estimate and 'Step N of M' counter to our first-session tutorial raises tutorial completion rate."
    estimated_effort_and_assumptions: "Small (about a day) if the tutorial already has discrete steps; assumes existing UI framework."
