gameplay:
    advertised_loop: "Competitive basketball: build/play a player, improve rating, play other people; alpha with anti-cheat claims."
    observed_loop: "Guided practice of three basketball verbs against AI (jumpshot with a timed release, pass to teammate, steal from a ball handler), then a hub menu of modes."
    video_observed_loop: "Videos show the loop past the tutorial: pick or build a player card, travel an open city park on foot or by go-kart, stand on a court spot to queue for a public 1v1/2v2/3v3 run or join a squad, play a short match with a live letter grade and box score, then spend coins on animations, badges and clothes to raise the build (yt_onboarding_1 3:30-9:45; yt_session_1 captions 0:00-9:00, frames 9:30-19:30)."
    first_action: "Hold E inside the shooting circle and release at the top of the jump."
    first_success_seconds: 17
    success_feedback:
        - "Shot-meter arc beside the player plus floating green 'Perfect Release' and '0% Contested' text and an OK-hand icon (7529591378-4)."
        - "Badge-style shield icon appears next to the player after a make."
        - "Full-screen 'Tutorial Complete!' card with a 1,000-coin reward (7529591378-17)."
    progression:
        - "Overall rating card under the player (99 for the player, 74 for the AI) with archetype text ('SF | 2-way offensive threat') and a 'Newcomer' rank badge."
        - "Coins currency; 1.5x Rep XP and 1.5x Badge XP banner; Daily Tasks; Season XP named in the daily-reward track."
        - "Video: player cards with OVR, height/weight/wingspan and archetype (e.g. '3-Level Architect'); several build slots, extra slots sold (yt_onboarding_1 3:30; yt_session_1 captions 0:30)."
        - "Video: badge trees per category (Finishing, Shooting, Playmaking, Defense) with tier requirements and badge points; Season Pass with 40 tiers; animation packs bought per move (yt_skilled_1 6:00; yt_session_1 captions 1:00-5:30)."
        - "Video: profile statistics page (games, points, win %, longest streak) in the Tab Menu (yt_skilled_1 0:15)."
    choices_and_variety:
        - "After the tutorial: Play 1v1 or Back to Menu; menu modes Play Now (preset characters), MyPlayer (create your own player), Learn PB, Credits."
    social_and_cooperative:
        - "Tutorial ends by offering a 1v1 against a real player; 'Play Now' and 'MyPlayer' imply online games (not entered)."
        - "Video: public park courts where players stand on court spots to form a run, a 'Leave Spot' prompt, squads of up to 4 joined by invitation (yt_onboarding_1 5:45; yt_session_1 14:00-14:30)."
        - "Video: private gym owned by the player with 'Gym Admin' and 'Customize Gym' controls (yt_onboarding_1 4:45; yt_session_1 9:45)."
    companions_and_pets: []
    friction:
        - "Step 3 target (the ball handler) spawned off-screen behind the camera's right edge, with only a faint 'Guard this player' label; finding it needed camera rotation (7529591378-7, -14)."
        - "Tutorial instruction panel is small, low-contrast white text on the left over a bright court."
        - "Pressing E again on step 2 triggered a correction ('That was a jumpshot - pass to your teammate instead'), legible only faintly behind the scene."
        - "Video: a 3.09M-subscriber creator says he had to watch YouTube guides to make a build and could not remember which animations he had already bought (yt_session_1 captions 1:40, 4:00)."
        - "Video: finding a game in the park was unclear: 'How do people even get in these games? Do they just wait ... until a round opens?' (yt_session_1 captions 13:30)."
        - "Video: in his first public match the same creator asked 'How do I pass?' and 'how do you shift lock?' and only then noticed 'G to guard' (yt_session_1 captions 15:40-16:15), so the tutorial verbs did not carry over for a player who had skipped or forgotten them (inference)."
    evidence: [play_1, yt_onboarding_1, yt_skilled_1, yt_session_1]
