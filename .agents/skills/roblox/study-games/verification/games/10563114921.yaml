  next_goal_clarity: "Play: low; arrows signal 'go somewhere' but no text named the goal, and the arrow path was hard to follow among giant pets. Videos: higher; a top-center banner names each tutorial step ('Steal an Egg!', 'Place your pet in here', 'Upgrade your Pen!', 'Use your treadmill to become faster') and a biome's speed requirement is visible before entering it (video_1, video_3). The play sample may not have shown the banner because the arrows were never followed to the nest."
  short_term_goals: ["Follow arrows", "'Unlock: $1K' sign", "Steal the next egg before nightfall (video_3 4:00)", "Hatch the egg in the pen (video_1, video_3)"]
  medium_term_goals: ["Fill the Forest index (0/8) to claim $100 and +420 speed", "Reach the next biome's speed requirement (900 for Lake, 10K for Desert) (video_3)", "Upgrade the treadmill ($15K) and pen (video_3)"]
  advertised_long_term_goals: ["Rarer eggs, sizes, mutations", "Base and treadmill upgrades", "126 pets in the index"]
  upgrade_choices: ["Speed via treadmill steps (advertised) or Robux packs (shop)"]
  mastery_versus_stat_growth: "Mostly stat growth (speed, money/s, pet weight). Videos show some route and timing skill: dodging the chasing animal, running in wide circles when under-speed, trap placement and attacking while facing away (video_2 tips)."
  unlock_previews_and_optional_activities: ["Index shows silhouetted '???' pets on rarity-colored tiles as previews", "World button in the Index", "Day/night countdown timer bottom-right (e.g. 'in 2m 45s')"]
  evidence: [play_1]
