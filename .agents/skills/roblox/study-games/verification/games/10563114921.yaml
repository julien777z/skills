gameplay:
  advertised_loop: "Steal eggs from pets and other players, hatch them into rare pets, pets earn money, upgrade treadmill and base, train on the treadmill for speed; rarer eggs, sizes and mutations."
  observed_loop: "Play (play_1): not reached; spawn in a safe zone with red guide arrows, a bat and three traps in the hotbar, others' giant pets. Videos (video_1, video_3): walk from the safe zone down a long corridor of biome areas, pick up an egg from a sleeping animal's nest, run back while the animal chases and other players hit or trap you ('RUN!!' banner, a 'Drop' button), place the egg in your own fenced pen where it hatches on a timer, place the pet to earn money per second, spend money on pen, treadmill and trail upgrades, and raise speed through the treadmill and Pet Index rewards to unlock the next biome's speed gate. A day/night countdown ends stealing at night and resets all eggs at dawn."
  first_action: "Follow the red 3D floor arrows from spawn; in video_1 they lead to a sleeping chicken's nest a short walk away (0:30), where a 'Steal an Egg!' banner names the task."
  first_success_seconds: null
  success_feedback: ["Welcome badge toast on join (bottom-right) (play_1)", "'You stole an EGG!' toast at screen bottom (video_1 3:15)", "Large rarity, pet name and $/s label over a newly hatched pet, then green '+$5' popups each income tick (video_1 2:15, video_3 2:45)", "Confetti burst on pen upgrade (video_1 4:30)", "Growing stacks of '+$4.5K' popups over a full pen (video_3 6:15)"]
  progression: ["Biome speed gates along one corridor: Lake needs 900 speed and Desert 10K at the start of video_3 (captions 2:45, 3:00), through Jungle, Snow, Volcano, Abyss Ocean, Prehistoric, Cosmic, Cherry Blossom and Titan Temple (video_2 2:45-5:10)", "Pet Index CLAIM rewards supply most early speed: the first claim lifted speed from 10 to 430 (video_3 0:30); the creator judged indexing a better early speed source than the 10-steps-per-step treadmill (video_3 captions)", "Treadmill upgrades for money ($15K first upgrade, 'cyber treadmill') and pen upgrades for more pet slots (video_3)", "Speed stat (shoe icon, 10 at start) and money ($0 at start) in bottom-left HUD", "Pet Index with world tabs: Forest 0/8, Unlocked 0/126, per-world collection reward ($100 and +420 speed) with a CLAIM button", "Growing Eggs panel with a 'Grow All' action", "'Unlock: [pet] $1K' sign at base", "+200/step treadmill pads"]
  choices_and_variety: ["Hotbar tools: slot 1 bat, slot 2 trap x3", "Which egg to take: small, large and giant eggs, gold and rainbow mutations, and per-biome eggs (video_1, video_2)", "Where to place traps: beside other players' traps to close gaps (video_2 tips)", "Whether to fight another player for an egg or server-hop (video_2)", "Rift: combine specific creatures' eggs for a chance at Divine pets, best during a 'yellow rotation' (video_2 2:00)"]
  social_and_cooperative: ["Stealing from other players is the advertised competition; a 'SAFE ZONE' floor marking protects spawn", "Leaderboard with Money/s and Speed columns at top right", "Players steal eggs others are carrying by hitting them with the bat, and block paths with traps and giant eggs (video_1, video_2)", "Rift boss fights are joined by several players (video_2)", "Players can comment on the treadmill's short-video feed (video_1 6:30)"]
  companions_and_pets: ["Other players' pets are scaled to enormous sizes (a weight label read 4,762,890Kg) and dominate the scene", "Pets stand in the owner's pen earning money per second; selling or unequipping frees a slot (video_1 5:15, captions)"]
  friction:
    - "Giant pets from other players repeatedly filled the camera; the camera clipped into them so several captures were a single flat color (10563114921-7.png, -8.png, -11.png, -14.png)."
    - "Guide arrows changed direction as the player moved (left, forward, right, back) and the destination never became visible in about four minutes."
    - "The speed '+' icon, which the first arrows appeared to point at, opened a Robux-priced speed shop rather than a free upgrade."
    - "Chat panel and a 'Chat with more people' tooltip opened over the top-left on entry."
    - "Videos: other players hit and trap a new player during the first steal; video_1's creator was trapped by an animal and hit by a stranger several times before his first egg reached the pen (captions, 0:45-2:00)."
    - "Videos: the Robux trail bought in video_1 'still felt slow' because the speed stat, not the trail, gates movement; the creator only discovered the treadmill by seeing another player on one (captions)."
    - "Videos: suspected exploiters with speeds in the millions take high-tier eggs; video_2's top tip is to leave and server-hop (captions, 0:15)."
  evidence: [api_1, play_1, video_1, video_2, video_3]
