gameplay:
    advertised_loop: "Photograph events in a park as a news journalist; what you broadcast changes how the crowd behaves, leading to one of 12 endings."
    observed_loop: "Move the viewfinder over the park and click to take a photo; the TV in the centre zooms to fill the screen and broadcasts the photo with a hashtag headline, then the crowd reacts (copies hats, gathers to say cheese, grows fearful). Only photos of specific events advance the story: a man in a bowler hat ('OOH NICE HAT', after which other peeps wear hats), a couple with hearts ('GROSS, GO GET A ROOM'), and a spiky-haired angry square ('CRAZED SQUARE ATTACKS', after which worried-faced circles appear). Ordinary shots give 'just some normal peeps', 'PEEPS SAY CHEESE' or 'WOWWEE, IT'S NOTHING'. (play_1) Videos (video_onboarding_1, video_skilled_1, video_session_1) show the same loop and extend it past where real play stopped: each broadcast escalates a chain (hat -> couple -> crazed square -> CIRCLE FEARS SQUARES -> SQUARE SNOBS CIRCLES -> CIRCLE HATES SQUARES -> ALMOST EVERYONE HATES EVERYONE -> BE SCARED. BE ANGRY.), the park turns pink-faced and armed, the camera pulls back to a laptop at the news station, and an ending card names the ending. Players then replay with different subjects (the lovers, the man in the suit paying the screamer, the cricket) to reach other endings; peace-themed shots are answered by the boss's captions ('peace is boring, violence goes viral', 'Nobody watches peeps get along. Bring me screaming.')."
    first_action: "Click PLAY on the main menu, then click anywhere in the park to take a photo"
    first_success_seconds: 47
    success_feedback: ["Full-screen TV zoom with the photo and a hashtag headline bar; story beats use a red bar with white bold caps versus black bars for non-events (10771871836-14-r, -18-r, -26-1 vs -4, -33).", "The crowd visibly changes after a story broadcast (hats spread, peeps cluster to say cheese, worried faces appear) (10771871836-15, -19, -26-3).", "Mini TV in the park keeps showing the last broadcast."]
    progression: ["Story beats within Chapter 1; 12 endings tracked on the menu ('0 / 12 endings found'); chapter switcher on the menu ('click to switch chapters').", "Ending card: polaroid of the ending with a 'NEW!' tag, 'ending 1 of 12', ending name and one-line moral, 'n / 12 endings found', red PLAY AGAIN and grey MENU brush buttons, footer 'new endings are unlocked now. hints are in the album.' (video_onboarding_1 7:30)", "ENDINGS album: 12 polaroids, found ones show art, unfound ones are black with the name visible, two 'secret' slots show a key; hovering shows a free one-line hint below (video_session_1 20:30)", "Skilled route reaches the first ending about 3:45 into a silent walkthrough and a second (cricket) in under a minute more (video_skilled_1 3:45, 4:30)"]
    choices_and_variety: ["Which events to photograph steers the story (advertised branching endings; branching itself not reached).", "Several distinct event types appeared (hat, lovers, crazed square, 'hi mom!', 'is this for TV?' bubbles).", "Videos show the branching: what is broadcast after the first beats decides between the viral, scared, peace/love, follow-the-money and cricket endings, and the cricket ending comes from photographing the cricket on the static intro screen rather than the park (video_onboarding_1 7:10, 9:22; video_skilled_1 4:15-4:30; video_session_1 20:33-22:10)."]
    social_and_cooperative: ["Single-player; in videos two creators or a streamer's chat co-solve which shot to take next (video_onboarding_1, video_session_1)."]
    companions_and_pets: ["A 'PET' panel with a cricket portrait sits on the left of the HUD; not opened (appears to be a sold item)."]
    friction:
        - "Targets wander continuously, so framing a moving subject needs quick aim; repeated misses return non-event headlines."
        - "After the crazed-square beat, the next required shot was unclear; about 14 minutes passed without another beat."
        - "The top-bar 'Hint' button opens a Robux purchase prompt rather than a free hint (10771871836-9)."
        - "Each photo locks input for a few seconds while the TV zoom plays."
        - "Videos: the step real play could not find is photographing the frightened circle at the moment a square yells at her ('CIRCLE FEARS SQUARES'); the creators found it after the nudge and a few tries (video_onboarding_1 2:01-2:30). A streamer with five endings still mis-timed shots and went to the menu to reread a hint (video_session_1 16:50-18:10)."
        - "Timing-sensitive triggers punish a late click: the player has to follow one peep and click during a brief reaction (video_onboarding_1 2:11-2:30, video_session_1 17:36)."
    evidence: [play_1, video_onboarding_1, video_skilled_1, video_session_1]
