transferable_ideas:
- Single-step tutorial banner plus a glowing floor trail from the avatar to the current target.
- First-discovery card ('NEW!' portrait + 'You have discovered...') turning a purchase into a collection moment.
- Walk-to-collect pickup with a big basket counter, then a lump-sum deposit for a two-beat reward.
- A server-wide sell multiplier on a short visible cycle (board plus 'Updating in 28s') turns a passive sell action into a timing decision (source_6).
- Tutorial steps that teach each system once (merge, processing upgrade) and then hand off with a persistent 'Home' button (source_5).
practical_takeaway:
  strongest_idea: One instruction at a time at top centre, paired with a world-space trail to the exact spot, got a fresh player through buy, collect and sell without reading any other UI.
  main_tradeoff: Walk-on pads make actions effortless but also trigger accidental purchases, including Robux prompts placed on the tutorial path. Videos add an escalating Robux multiplier ladder and Robux 'Skip'/'Finish Now'/'Unlock' choices placed beside every free progression action (source_4, source_5).
  suitable_genres_and_stages:
  - Tycoon and simulator onboarding
  - Any game with a fixed first-loop route
  testable_hypothesis: A floor trail to the current objective reduces time to first purchase versus a banner alone for new players.
  estimated_effort_and_assumptions: 'Small: a beam or decal path between avatar and target plus a step banner; assumes objectives have known world positions.'
inferences:
- Robux pads on the tutorial route likely produce accidental purchase prompts for new players (one occurred in this sample).
- The fluctuating egg multiplier likely gives idle players a reason to stay and watch the board (inference from source_6 narration; not measured).
uncertainties:
- Whether the unintentional extra chickens came from the Buy 1 pad repeating or from stepping on Buy 5 is unclear.
- Merge, rebirth and lucky blocks are seen only in videos, with Robux-boosted progression; event mechanics were not seen.
- Whether the Rebirth modal opens automatically during the tutorial (source_5 1:30) is unclear.
