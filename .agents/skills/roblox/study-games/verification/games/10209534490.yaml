gameplay:
  advertised_loop: Buy chickens, they lay eggs, convert eggs to cash, merge chickens into rarer ones, build up the nest, earn offline (source_1).
  observed_loop: Walk onto a 'Buy N' pad to spend cash on chickens; chickens fill a nest and drop eggs on the red floor; walk over eggs to pick them up into the Eggs basket; walk onto the Deposit Eggs stand to sell them; walk onto Collect Cash to bank the base's earnings; spend again on larger buy pads (Buy 5, Buy 25, Buy 100) whose prices rise after each purchase.
  first_action: Close the auto-opened Quests/Login Streak modal, then follow a glowing chevron trail to the 'Buy 1 $5' pad.
  first_success_seconds: 156
  success_feedback:
  - Chicken portrait with 'NEW!' tag and 'You have discovered the Basic Chicken!' line on first purchase (10209534490-12).
  - Eggs basket counter jumps (0 to 43) as eggs are walked over; tutorial counter 'Collect 3 Eggs 1/3' (10209534490-13, -14).
  - Floating 'Deposited 82 Eggs!' text at the stand (10209534490-15).
  - Gold bars rain from the sky around the base throughout.
  - Merge happens on contact and shows a new-tier chicken; first merge turned three Basic chickens into a Duck (source_4 captions, source_5 1:45).
  - Rare egg variants (golden, diamond, spotted 'special' eggs) count as several eggs when picked up (+5 shown; source_4 and source_5 captions, source_6 captions).
  - "'Collected $N Cash!' and 'Deposited N (+bonus) Eggs [x1.12]!' floating lines show the multiplier applied (source_4 7:30, source_5 2:15)."
  progression:
  - Buy-pad tiers (Buy 1/5/25/100) with prices that rise after purchase ($5 to $22; Buy 5 $25 to $110).
  - Total Chickens counter (0 to 11 in the sample).
  - 'Rebirth button and counter; ''Upgrade Buy Tier Basic > Duck [REQ: Rebirth 1]'' sign.'
  - Index book for discovered chickens; Merge pad.
  - Tier ladder of chicken types (Basic T1, Duck T2, Dirt T3, Bee T4, Mushroom T5, Dummy T6, Goose T7, Villager T8 and beyond, creator says about tier 25) shown as labelled nests along the base (source_4, source_5).
  - Processing upgrade pad raises eggs sold per second (2 to 28+ per second) beside the 'Selling Eggs' board (source_5 2:15, source_6 2:30).
  - Rebirth resets cash, eggs, chickens and processing level for +2 buy tiers and x3 cash; the first requirement is $1M (source_5 1:30).
  - Global leaderboard of chicken counts (top entry in the hundreds of thousands to a trillion) (source_4 2:30).
  choices_and_variety:
  - Which buy pad to spend on; merge versus keep buying (Merge pad seen, not used).
  - 'Sell timing: a server egg multiplier changes every 30 s between about 0.5x and 1.5x; the guide advises holding eggs while it is below 1x (source_6 2:30-3:45, captions).'
  - Lucky blocks dropped by chickens open a panel with tier odds (e.g. 75/20/5%), a cash cost, a Robux 'Unlock' and a 'Discard' (source_4 7:30, source_6 2:15); the guide advises skipping them early.
  social_and_cooperative:
  - Other players' bases sit next to yours with nameplates; no interaction observed.
  companions_and_pets:
  - Chickens are the collectibles/producers; rarer types unlocked by merging (advertised).
  friction:
  - Buy pads are triggered by walking on them, so stepping onto a neighbouring pad bought extra chickens unintentionally (Total Chickens jumped to 10, then 11).
  - Robux pads ('Finish Now' 19 R$, 'Auto Collect' 29 R$, 'x2 Eggs' 499 R$) use the same walk-on floor-pad shape as cash pads and sit on the tutorial route; walking along the Collect Cash trail opened a Robux purchase prompt.
  - Base edge has no barrier on one side; overshooting the first pad dropped the avatar into the moat.
  - In source_5 a Rebirth modal with a Robux 'SKIP (No Reset)' button appeared during the 'Get 3 Chickens' step (1:30); whether it opened automatically or by a click is not visible.
  - Robux 'Finish Now' pad sits directly beside the cash-priced processing upgrade pad (source_5 2:15, source_6 2:30).
