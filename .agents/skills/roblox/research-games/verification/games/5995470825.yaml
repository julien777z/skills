gameplay:
    advertised_loop: "Fast first-person gunfights across Team Deathmatch, Capture the Flag, Free for All and Gun Game, 1v1/2v2 duels, ranked ladder, abilities, and coins/gems unlocking weapons, skins and abilities (description)."
    observed_loop: "Spawn from a menu (Space/F) into a protected spawn room, run out into a blocky arena, shoot, die, see a killcam of the killer's weapon, respawn from a menu that advertises deals; the match runs to a score (first to 200) or a 10-minute timer, then reward cards (coins, XP) and a results page with rank progress."
    first_action: "Close the previous match's results panel, then press Space on the SPAWN button ('Spawn to start playing!' callout)."
    first_success_seconds: null
    success_feedback: ["Team VICTORY banner and score on results page", "Reward cards '+N COINS' and '+N XP' with 'Click anywhere to continue'", "Rank progress line 'Play N more games to see your rank'", "Live per-player kill counters on the top score strip", "Video: each kill shows the victim's name with '+180' coins and a skull kill icon at the crosshair; assists show '+N' (video_1 0:15-1:45, video_3)", "Video: medal icons above the crosshair for Headshot!, Point Blank!, Longshot and Revenge (video_1 0:30, video_3 1:00, 9:00)", "Video: killed enemies burst into floating '+11'-'+15' coin pickups (video_1 1:45, video_2 4:30)", "Video: vertical yellow killstreak bar on the left with 'Killstreak xN', which drains and ends the streak (video_1 5:50 captions)", "Video: level-up modal 'Congratulations! You hit level 4! +500 gems +10,000 coins' mid-match (video_1 1:30)"]
    progression: ["Video: account level with gem and coin rewards per level, and abilities unlocked by level ('You unlocked a new ability! Rewind', video_1 7:30)", "Video: weapons unlock with coins (for example 1,000,000 coins on a locked rifle) and show a kill count per weapon (video_2 0:30)", "Video: quests on the spawn menu with progress bars and rewards: 'Get 50 headshots' (500 gems), 'Get 10 midair kills' (gold chest), 'Get 10 kills with a melee weapon' (40,000 coins), 'Complete quests for XP' (premium weapon chest) (video_1 0:00)", "Ranked placement after 5 games (rank badge with RANK INFO)", "Coins and XP per match; VIP 20% coin bonus shown struck-through for non-VIP", "Playtime Rewards ladder from 1,000 coins up to 40,000 coins, gems, chests and Diamond case over ~3 hours", "Free Spin wheels on 23- and 33-minute timers", "Loadout with three weapon slots and three abilities (Q/E/X)"]
    choices_and_variety: ["Video: More Gamemodes picker with a 'Recommended!' Duel Hub, Casual 1v1/2v2/3v3, Gun Game and Only Snipers (video_1 7:45); the creators believed modes unlocked after their first match, though the button was already on the spawn menu at 0:00", "Video: Gun Game swaps the weapon after every kill, first to 30, ending on a melee weapon (video_1 7:55-11:20 captions)", "Video: weapons dropped by killed players can be picked up with G (video_1 1:20 captions)", "Video: ability pool with descriptions and cooldowns (Shattering Hex 10 s, Throwing Kunai 4 s) and two marked 'Free This Week' (video_2 0:45-1:00)", "Mode rotates between matches (Capture the Flag then Team Deathmatch observed)", "Three abilities on Q/E/X with visible cooldown number (Q showed 9.1 s)", "Loadout, Shop and Settings buttons on the spawn menu"]
