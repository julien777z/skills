gameplay:
    advertised_loop: "Join a faction army in Napoleonic-era (1804-1815) line battles with very large player counts, depicted as organised community events ('a game community')."
    observed_loop: "Off-game: join a nation's Discord, verify the Roblox account, enlist in a regiment and receive a uniform and rank (video_2 captions, video_1 0:30-2:15). In-game: paste the battle's six-letter code from the regiment's Discord into the menu, teleport to the battle server, press Space to spawn with the line (video_2 5:08). Then form a line on the flag, ready and aim muskets on the officer's order, fire volleys, chant on '3 2 1' to restore morale, reform after losses, fix bayonets and charge, and protect or capture flags; deaths cost tickets and the team with more tickets at the end wins (video_2, video_3)."
    first_action: "Ready the musket with F or R and aim with left click while standing in the line formed on the flag (video_1 2:15 captions; video_2)."
    first_success_seconds: null
    success_feedback:
        - "Musket smoke clouds and fallen enemy avatars across the line after a volley (video_1 3:45-8:00; video_3 2:15-3:00)."
        - "Kill feed in the centre-top area: 'Flag rescued by ...', '<line> were scattered', '<line> broken by the <line>' with nation flags and crossed-sword icons (video_2 8:45, tRFgldMJD2U-016.jpg; video_3 7:00)."
        - "Team ticket bar at top centre updates continuously (video_3 4:30)."
        - "Bonus badges appear above the bottom-left bars when earned (Chant, Volley, Near, Rush, Line, Skirmish), each an icon on a coloured circle with a label (video_2 8:00-11:25)."
        - "Officer praise and medals after battle over voice chat ('Men, you acquitted yourselves valiantly... medals', video_3 captions)."
    progression:
        - "Community, not game, progression: regiment ranks (conscript upward), companies (fusiliers, voltigeurs, grenadiers) with distinct cosmetics, and nation medals earned on and off the game, some shown on the avatar (video_2 captions 3:22-5:08)."
        - "Roles a ranker can grow into: flag guard, flag bearer, officer leading a line (video_2 12:19-13:08)."
        - "No in-game currency, XP or shop seen in any video."
    choices_and_variety:
        - "Three unit types: line infantry, skirmishers (about 15 players, accurate rifles, weak melee) and cavalry (video_2 11:25-12:19)."
        - "Infantry roles: officer, flag bearer, flag guards, rankers (video_2 12:19)."
        - "Battlefields seen: open farmland with roads, walled farm compounds and a village square (video_1, video_2, video_3); the Waterloo event split one battlefield into three named server sectors (La Belle Alliance, La Haye Sainte, Rossomme)."
    social_and_cooperative:
        - "Play depends on coordination: officers give orders by voice ('make ready, present, fire', 'reform', 'fix bayonets'); the guide tells new players to join the regiment's voice muster or 'you won't be able to hear orders' (video_2 5:08 overlay; video_3 captions)."
        - "Synchronised mechanics reward acting together: chants must be timed between teammates, volley bonus needs enough of the line firing at once, line bonus needs three adjacent rankers standing still (video_2 9:11-11:25)."
        - "A voice-line wheel of regiment-specific battle cries opens over the view (video_1 4:45, Y3bYJD038c0-020.jpg)."
        - "Regiment identity shown through nation flags on the leaderboard, colours carried in battle and uniforms (video_2 6:00; video_3)."
    companions_and_pets: []
    friction:
        - "Entry requires steps outside Roblox: joining Discord, verifying with a third-party account-linking bot, enlisting in a regiment by a posted format and waiting for an officer, then getting a battle code from the regiment's channel; the guide says verification is required to play (video_2 captions 2:30-3:22, 5:08)."
        - "The guide opens 'This game can be hard to navigate for someone not familiar with the genre' and exists because new players need a 19-minute explanation (video_2 0:00)."
        - "Many hidden rules affect combat (morale from near misses, distance from flag, line bonus broken if a neighbour moves, ticket cost by formation); none are taught in the footage by the game itself (video_2 7:00-11:25; inference that the game does not teach them, since no in-game tutorial is shown)."
        - "Thick musket smoke often hides the enemy and the view (video_1 7:30; video_3 9:15)."
        - "Without battles scheduled, the guide describes ordinary servers as 'capturing points in Bau', a casual mode; whether a lone joiner has anything structured to do between battles was not shown."
    evidence: [description_1, places_1, video_1, video_2, video_3]
