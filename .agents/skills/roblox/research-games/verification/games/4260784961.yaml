transferable_ideas:
    - "Rewards for acting together in space and time: a line bonus for three adjacent players standing still, a volley bonus for firing together and a chant that only pays when synchronised turn coordination into a measurable advantage, not just a social nicety (video_2)."
    - "A shared resource per squad (company points spent on each death, with a lower cost in formation) makes staying together the cheapest way to fight, and a visible 'broken' state with a clear two-condition recovery panel explains the consequence (video_2, video_3)."
    - "Linked servers whose scores combine let one event exceed a server's player cap while each server stays playable (video_3)."
    - "Community structures (regiments, ranks, medals, scheduled battles) carry long-term progression and return visits with no in-game monetisation (video_2)."
    - "A sparse edge HUD with hotkey letters on each round button and hover labels keeps the battlefield visible."
practical_takeaway:
    strongest_idea: "Make formation the reward: bonuses that require players to stand together, fire together and chant together, plus a squad-wide respawn pool that drains slower in formation, turn a simple shooter into a game about coordination (video_2, video_3)."
    main_tradeoff: "The rules are deep but untaught in the game shown: newcomers rely on Discord enlistment, a bot verification, officers' crash courses and 19-minute YouTube guides, and solo play has little structure; this suits a committed community and excludes casual joiners."
    suitable_genres_and_stages: ["team combat", "squad-based PvP or PvE", "community or event-driven games with an established player base"]
    testable_hypothesis: "Giving a squad a visible bonus when three or more members stand within a few studs of each other (with an icon and label on the HUD) increases the share of time players spend grouped and their win rate, compared with no bonus."
    estimated_effort_and_assumptions: "Estimate: 2-4 days for a proximity-based squad bonus and its HUD badge, assuming existing squads, combat stats and a HUD framework."
inferences:
    - "Top Revisited rank, 141,618 group members, scheduled battles with join codes and community ranks and medals indicate return play is driven by community events (supported by video_2 and video_3)."
    - "No game passes, no in-game shop in the footage and one badge indicate a low-monetisation design."
    - "Inference: the off-game onboarding path filters newcomers heavily; players who complete it are committed, which may explain a large returning base but a modest concurrent count (368 at retrieval)."
uncertainties:
    - "The in-game first join, menu and any built-in tutorial are unobserved; video studied covers battles only."
    - "What an unaffiliated player sees on an ordinary server between scheduled battles ('capturing points') is unobserved."
    - "Numbers for ticket costs and bonus durations come from a community guide and may be out of date."
    - "Role of the palace, theatre and academy places remains unknown."
