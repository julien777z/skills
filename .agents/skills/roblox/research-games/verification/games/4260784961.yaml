failure_and_recovery:
    observed_failure: "Death by musket or bayonet; a line 'breaks' when its company points reach zero, and then cannot respawn (video_2 7:00-8:45; video_1 captions)."
    explanation: "Death screen names the killer (rank, name, nation), the distance in studs and the player's formation (for example '1 Line Formation'), with a respawn wait bar (video_3 6:45, EoYoQbUqtdE-024.jpg). A broken line gets a 'Recover!' panel at top centre with two conditions: 'Survive' with a countdown and 'Far From Enemy Flags' with a tick or cross (video_2 8:45; video_3 7:00)."
    cost_or_lost_progress: "Each death costs the line 2 (in line), 3 (near allies) or 4 (out of formation) tickets per the guide; no personal progress is lost (video_2 captions)."
    retry_seconds: "Respawn wait shown as 'Wait 0.5s' on the death screen at that moment (video_3 6:45); respawn needs the line's flag to be held (video_2)."
    checkpoints: "Respawn at the line's flag bearer; no flag, no respawns (video_2 12:19)."
    non_paid_recovery: "All recovery is free: survive the countdown away from enemy flags to recover a broken line; no paid revive seen."
    evidence: [video_2, video_3]
