ui:
    evidence_status: observed
    visual_style: "Restrained period-themed HUD: dark navy translucent panels with thin gold borders, serif text, round dark icon buttons with cream illustrated glyphs; the rest of the screen is left to the battlefield (video_1, video_2)."
    layout_and_hierarchy: "Top centre: team ticket bar with the two nations' circular flag emblems, a red versus navy split bar with ticket counts, battle timer above and a compass strip below (tRFgldMJD2U-016.jpg). Top left: Roblox menu icons and chat bar. Bottom left: three stacked bars labelled Health (green), Morale (red/pink) and Company (blue, with arrow chevrons and a number), with earned-bonus icons above them. Bottom centre: weapon slot icons. Bottom right: row of round menu buttons with hotkey letters (Settings Y, Company T, Shako H, Loadouts Z, Backpack B, Chants) that show a label tab on hover. Centre-top: Recover! panel and kill feed when relevant (Y3bYJD038c0-031.jpg, tRFgldMJD2U-008.jpg)."
    color_scheme: ["Dark navy translucent panels", "Gold/cream borders and glyphs", "Red (British) versus navy (French) ticket halves", "Green health, red morale, blue company bars", "Red crosses for unmet conditions"]
    typography:
        font_appearance: "Serif text throughout (panel titles, labels, kill feed, numbers), in keeping with the period theme; overlay text in the guide is a separate edit font."
        font_family_if_verified: null
        size_observation: "Bar labels and menu tab labels roughly 12-18 px tall in 960 px wide frames; Recover! title about 20 px; ticket numbers about 14 px."
        size_basis: visual_estimate
        viewport_resolution: "Videos at 480p, frames scaled to 960 px wide"
        readability: "Readable at 480p on the panels; small serif labels on the bottom-left bars and the kill feed are thin and become hard to read over bright grass or smoke."
    controls:
        primary_actions: "Keyboard and mouse: F or R ready, hold left click aim, release fire, Q chant, F then B bayonet, Tab leaderboard, Space spawn (video_1, video_2 captions)."
        close_x_appearance_and_location: null
        modal_behavior: "Leaderboard (Tab) is a large centred dark panel with collapsible per-line rows (video_2 6:00); voice-line wheel is a centred dark radial menu over the view (Y3bYJD038c0-020.jpg)."
        state_feedback: "Bonus icons appear and disappear above the bars; morale bar empties under fire (87 to 10 between frames, Y3bYJD038c0-020 and -031); Recover! conditions show red crosses until met."
        target_size_and_input: "Bottom-right round buttons about 45-50 px at 960 px frame width; designed around keyboard hotkeys shown on each button."
    graphics:
        graphics_versus_text: "Mixed: icons carry a hotkey letter and reveal a text label on hover; bars carry text labels and numbers; bonuses use icon plus label."
        illustration_or_icon_style: "Cream silhouette glyphs (treble clef, flag, shako, kit) on round dark buttons; nation flags as circular emblems with laurels."
        framing_outlines_and_effects: "Thin gold frames on panels, rounded bars, coloured glowing circles for bonus icons."
        placement_and_labels: "Hover labels sit above each bottom-right button as tabs (tRFgldMJD2U-008.jpg)."
