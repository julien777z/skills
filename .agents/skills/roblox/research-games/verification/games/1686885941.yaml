gameplay:
  advertised_loop: "Own a house, drive vehicles, pick a roleplay identity (student, parent, police officer, workers) and roleplay with others across a city."
  observed_loop: "Welcome screen with PLAY -> HUD with labelled side buttons (Avatar, Tools, Animations, Vehicle, House) -> House menu plot browser -> GO teleports to a vacant plot -> click the plot sign to claim it -> pick a house from a catalogue and confirm -> Vehicle catalogue spawns the vehicle with the player already seated -> drive and customise (colour picker, lights, music, speedometer)."
  first_action: "Click PLAY on the welcome screen (13 s after control)."
  first_success_seconds: 169
  success_feedback: ["Plot sign immediately changes from 'Vacant' to the player's name (1686885941-9).", "Selected house tile gets a large green check and a 'Choose selected house?' thumbs-up/down confirm (1686885941-10).", "House-owner toolbar appears above the HUD after the house spawns (1686885941-11).", "Spawning a vehicle seats the player on it and swaps in a vehicle toolbar (1686885941-18)."]
  progression: ["None observed: no currency, XP or levels; progression is choosing houses, vehicles and props, many behind passes."]
  choices_and_variety: ["Job picker grid with icon-and-label tiles (police, doctor, chef, model, singer, news, YouTuber, principal, day care, detective, gamer, ice cream, lifeguard and more) that sets a role title on the avatar (video_2 4:30).", "Town themes that restyle the whole map for the player (racing, military, Japanese, neon), some behind a Theme pass (video_2 4:45-5:00).", "Vehicles beyond cars per the guide's captions: skateboards, hoverboards, bikes, horses, golf carts, motorcycles, limousines, boats that only spawn at sea, and a jet spawned from a military-base garage with Premium and the Estates pass (video_2 captions 13:00-17:00).", "Seasonal event: a 60-item candy-corn hunt across the map with unlockable items such as a Jack o' Lantern (video_3).", "House catalogue tabs: Passes, Homes, Job, Themed (1686885941-9).", "Vehicle categories: favourites/crown, bikes, cars, trucks, robots, boats; items include scooter, skateboard, wheelchair, pogo stick, helicopter, tank, horse (1686885941-12, -13).", "Plot browser with three house-area tabs (standard, premium-styled, beach) (1686885941-4)."]
  social_and_cooperative: ["Family panel lets a player add a named child avatar that follows them; any child look needs Premium (video_2 5:30).", "Player name and bio shown above the avatar ('BlueGuy', 'Like') set from the Avatar tab (video_2 4:30).", "Car lock so others cannot drive the player's car (video_2 captions).", "Family button and Home Cams button in the HUD (not opened).", "Neighbouring plots show other players' names; chat badge counted rising unread messages (not opened).", "Trailer (video_preview_1): staged group scenes of shared roles and places: police helicopter and car chasing a robber (0:02-0:08), students at the school doors (0:10), friends eating at a cafe (0:28), a group dancing at the night plaza (0:32-0:38). Promotional staging, not observed play."]
  companions_and_pets: ["Pet cat or dog from the Tools tab that the player can carry, with a hold-pose button (video_2 captions, not in the studied frames)."]
  friction: ["Video_2 notes many copies of the game exist and tells beginners to find the real one by its creator and player count (0:30 captions).", "Several premium items and faces sit beside free ones with only a lock or star; the guide repeatedly says 'you need premium' or a pass for colours, speed, music and faces (video_2 3:30-10:00 and captions).", "Many houses and vehicles carry small star/crown/region badges that only reveal they are paid when clicked; clicking a star item opens a 'You need the Premium Gamepass to use this!' banner and an 'Unlock Premium?' 320-Robux prompt (1686885941-16).", "The first free car click produced no visible result and no message (1686885941-14).", "Claiming a plot requires noticing a hand cursor on the plot sign after teleport; the GO teleport placed the camera inside a wall (1686885941-6).", "VIP upsell 'No wait time for VIP, Houses cooldown = 10 minutes' sits at the top of the house picker (1686885941-9)."]
  evidence: [source_1, source_3, source_4, video_preview_1, video_2, video_3]
