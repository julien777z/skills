gameplay:
    advertised_loop: "Train as a swordsman or Blox Fruit user, fight enemies and bosses, sail between islands to find secrets; level cap 3000; fruits spawn hourly and a dealer restocks every 4 hours (description)"
    observed_loop: "Real play (play_1): pick a team, follow the compass's recommended-quest marker to the starter NPC, equip Combat and punch a Bandit [Lv. 5]; the quest, XP, level and stat-point steps were not reached. Videos (video_1, video_2) show the full loop: talk to a quest giver, a tracker appears ('Defeat 5 Bandits 0/5, $350, 300 EXP'), kill the count, get QUEST COMPLETED with money, XP and several level-ups at once, spend stat points, take the next quest from the same giver; after the island's last quest (a boss) the game announces 'NEW QUEST AVAILABLE! Open your compass menu to find the next island' and the player swims or sails to the next island. Fruit rolls (Lv. 50+ without Robux) and weapons bought from dealers change the attack kit along the way."
    first_action: "Choose Pirates or Marines on a full-screen Pick A Side! panel (play_1; also shown at video_3 2:45)"
    first_success_seconds: null
    success_feedback:
        - "Hits show a large white-red impact burst with a big damage number on the target (994732206-34.png)"
        - "Quest completion stacks centred text lines: 'Earned $X', 'Earned N Exp. (2x) (+Melee 2x)', '<QUEST COMPLETED!>', 'LEVEL UP! (11)', 'Combat MASTERY LEVEL UP!', with a white-blue burst around the player (video_1 2:00, video_2 0:30)"
        - "Level-up flash and a new quest offered at once keep the next action obvious (video_2 0:30)"
    progression:
        - "Observed UI: Lv. and an XP bar (0/86) above Health and Energy bars; Stats panel with Melee, Defense, Sword, Gun and Blox Fruit, the last three locked; Stat Points counter, Custom Amount field and Refund button (994732206-8.png)"
        - "Per-weapon mastery: Combat panel shows Mastery 1 (0/70), Quick Tackle [Z] at Mas. 1 and Ground Smash [X] greyed until Mas. 20 (994732206-34.png)"
        - "Island ladder in the first sea, each with 2-3 enemy quests ending in a boss: Pirate Starter bandits, Jungle monkeys, gorillas and Gorilla King (Lv. 25 boss), Pirate Village pirates, brutes and Chef (Lv. 55 boss), Desert bandits and officers, Frozen Village snow bandits, snowmen and Yeti (Lv. 110 boss), then Marine Fortress and Skylands (video_1, video_2 captions)"
        - "First Blox Fruit without Robux comes from the fruit gacha at about level 50; the creator calls reaching it his halfway goal (video_2 captions 1:00-2:00)"
        - "Quest rewards scale fast: $350/300 EXP at the first quest, $2,000/9,500 EXP for the Gorilla King, $10,000/220,000 EXP for the Yeti (video_1)"
        - "Ability teacher on the snow island sells Air Jump, Flash Step and Aura for in-game money (video_2 captions 5:00)"
    choices_and_variety:
        - "Team choice at join: Pirates (bounty, crews) or Marines (faster, cheaper ships, claim bounties), each with three short benefit lines (994732206-1.png)"
        - "Fruit choice drives build: the skilled player rolls Dark, finds it poor for grinding, rerolls into Bomb and then a better fruit, and refunds stat points into Blox Fruit before a boss (video_2 captions 2:00-6:00)"
        - "Self-set challenges (collect every sword, a bazooka and shades in the first sea) show optional collection goals players adopt (video_2 captions 3:00)"
    social_and_cooperative:
        - "Server leaderboard lists players by bounty/honor, with team rows such as Pirates (994732206-1.png)"
        - "Other players compete for the same bosses: 'this guy's trying to steal my boss... it gave me the levels, but I didn't get the mastery' (video_2 captions 2:00-3:00)"
        - "Event raids (factory Core, Great Pumpkin) are fought alongside other players in the server (video_3 3:00-7:30)"
    companions_and_pets: []
    friction:
        - "Without Robux the first fruit waits until about level 50; the skilled player calls early enemies 'so annoying' without one (video_2 captions 0:30)"
        - "Boss slam attacks can nearly one-shot a low-level player; the player is reduced to Health 28/100 by the Gorilla King (video_2 1:00)"
        - "Fruit gacha results can be poor for grinding, prompting rerolls (video_2 captions 2:00-4:00)"
        - "The start gives no direct prompt: the recommended quest and its world marker appear only after clicking the compass (994732206-13.png)"
        - "Bandits attacked while the player was still in the labelled safe zone (Health 95/100, 994732206-34.png)"
    evidence: [source_1, play_1, video_1, video_2, video_3]
pacing:
    timing_start_definition: "Real play: launch command at 00:37:07Z; control = team-pick screen interactive. Videos: each video's own timestamps"
    loading_seconds: 30
    time_to_control_seconds: 30
    first_meaningful_choice_seconds: 30
    first_reward_seconds: null
    action_reward_cadence: "Video (edited, so compressed): every enemy kill pays money, XP and weapon mastery in a text line; a quest of 5-8 kills pays a larger lump and usually several level-ups; a boss closes each island. In video_1 the first quest goes from accepted (0:12) to completed (0:39) in 27 s of edited video. Real play reached no reward."
