gameplay:
    advertised_loop: "Spin for a random anime character, choose which of its stats (Strength, Speed, Abilities, IQ, Durability) to keep, repeat to assemble one character from the best stats of several, then fight another player 1v1; wins earn cash and rank."
    observed_loop: "Video (video_2, video_3, video_4): in a hub of tables, the player sits at a table; when an opponent sits (or the player presses 'Fight with AI') a full-screen build screen opens. Both players roll at the same time; each roll shows one character card (portrait, name, series, rarity) and the player places it into one of five empty stat slots with a '+' button before a per-pick countdown (about 20 s) ends. Stat values are hidden while building, so the player places characters by what they know of the anime. Opponent slots are visible as portraits, some marked 'STEAL'. After five picks a 'Showdown' reveals each slot's number and an average score; the higher average wins and a winner screen shows a letter grade, the average, a five-axis radar chart, and 'Rematch' (with a ready count and countdown) or 'Leave'. Cash rises after wins."
    first_action: "Video_2: walk from spawn to an open table and sit (about 0:30-0:57)."
    first_success_seconds: null
    success_feedback:
        - "Video: a legendary roll appears in a flaming frame on the card (video_3 6:00, video_4 1:15)."
        - "Video: winner screen with gold 'WINNER' text, a crown on the winner's avatar portrait, a large green letter grade (B seen), the average score and a radar chart of the five stats (video_2 2:15, video_3 2:00)."
        - "Video: cash counter rose from $200 to $500 to $1,000 across the first matches (video_2 0:45, 5:00, 5:45)."
    progression:
        - "Evidence (stats_1): win-count badges (1, 5, 10 wins) and build-quality badges (Legendary, S Tier) and a rarity badge (Mythical), suggesting tiered build grades and character rarities."
        - "Video: a mode panel at the table offers Classic ($100 table, any character), Anime Decks ($100, pick an anime), Legendary ($150, legendaries only) and Reverse ($200, worst character wins); Legendary and Reverse show '3/5 WINS' and 'Win matches to unlock new modes!' (video_3 6:30)."
        - "Video: a player title over the avatar ('NOOB' with level flame 1 on a new-looking account) (video_2 0:45)."
        - "Video: hub leaderboards for top wins, top streaks and top playtime, a 'Next Mythical Vote' board, and a 'Grand Prize' spin wheel by a four-seat table (video_2 0:45, video_3 6:15, video_4 5:45)."
    choices_and_variety:
        - "Advertised (thumbnail_1): after each spin the player chooses one stat to take, a small per-spin decision under uncertainty ('BEST STAT?')."
        - "Advertised (description_1): characters from several anime series and a series-themed mode."
        - "Video: per roll, which of the remaining slots to fill; bottom actions 'Reveal All', 'See Best', 'Reroll', 'Steal' and 'Shuffle' (video_2 1:30). Their costs or limits were not shown in frames."
        - "Video: table modes as above; a two-seat 1v1 table and a four-seat table (video_4 5:45)."
    social_and_cooperative:
        - "Advertised: 1v1 battles against other players; community vote decided a new character (description_1)."
        - "Video: matchmaking toast '<player> needs an opponent...' with 'Join' and 'Dismiss' (video_4 0:15, 6:00)."
        - "Video: while waiting alone at a table, 'Tired of waiting? Fight with AI! PLAY!', plus 'Invite Friends' and 'Change Mode' (video_2 0:55, video_4 5:30); captions: 'Do I play with a bot or do I leave?' (video_4)."
        - "Video: other tables show live matches in the hub with 'PvP A VS B' and 'Turn 2/5' over a strip of picked portraits, so spectators can follow (video_2 0:45, video_4 6:00)."
        - "Video: 'Invite a Friend!' toast on the winner screen and a 'Friends Boost: +0%' meter (video_2 0:45, 2:15)."
    companions_and_pets: []
    friction:
        - "Inference: luck-boost and infinite-reroll passes sit directly on the core spin, so paid advantage likely affects 1v1 outcomes; unverified without play."
        - "Evidence: about 31% of votes are downvotes (stats_1); cause unknown."
        - "Video: stat values are hidden while placing, so a player who does not know a character guesses; captions: 'I don't know who she is, so I'm just going to put her in this' and 'What am I supposed to do with these?' (video_4)."
        - "Video: waiting for an opponent; captions 'Can this load faster?' and the AI-fight prompt exists for this wait (video_4, video_2 0:55)."
    evidence: [description_1, stats_1, thumbnail_1, video_2, video_3, video_4]
