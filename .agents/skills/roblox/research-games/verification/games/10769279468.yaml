transferable_ideas:
    - "Video: hidden values during the draft. The player places each random character into a stat slot without seeing its number, so knowing the source material is the skill and the showdown reveal is the payoff (video_2, video_3, video_4)."
    - "Video: a short, synchronized 1v1 draft (five picks, about a minute) with the opponent's board in view and a steal action, so every pick is also a reaction (video_2)."
    - "Video: 'Fight with AI' on any table that waits, removing the empty-server wait without removing the PvP framing (video_2 0:57)."
    - "Video: matches play out at physical tables in the hub with a pick strip and turn counter above them, so newcomers see the loop before sitting down (video_2 0:45)."
    - "Spin-then-choose: a random draw followed by a small player choice (which one stat to keep) turns pure luck into a decision each roll."
    - "A fixed set of five stats, each with its own color and icon, used consistently in art and UI (video confirms the in-game UI follows the thumbnail convention)."
    - "Build-grade badges (S Tier, Legendary) that reward the quality of an assembled result rather than time spent."
    - "Video: modes unlocked by wins (Legendary, Reverse 'worst character wins') reuse the same draft with a twist (video_3 6:30)."
practical_takeaway:
    strongest_idea: "A one-minute draft where the player assigns random picks to slots with values hidden, then a side-by-side reveal: the reveal explains the result stat by stat and turns knowledge of the theme into skill (video_2, video_3)."
    main_tradeoff: "Players who do not know a character can only guess, and the visible luck, reroll and steal actions plus a hub ringed with offers invite pay-to-win suspicion (video_4 captions, video_2 0:45; inference about perception)."
    suitable_genres_and_stages: ["gacha and collection games", "character or loadout builders", "quick PvP lobby games", "early-game loadout drafts"]
    testable_hypothesis: "In a pick-and-place draft, hiding values until a reveal increases rematch rate against showing values while placing, at the cost of more guessing by newcomers."
    estimated_effort_and_assumptions: "Estimate: small to medium, assuming an existing random reward and attribute system to extend with a slot board, a timer and a reveal screen."
inferences:
    - "Very fast growth (about 6.8M visits in five weeks) with a single core mechanic advertised in every image suggests the hook is legible from the thumbnail alone; popularity cause is not established."
    - "Video: the table seat counter, live match strips and the AI fallback do the onboarding work a tutorial would; no tutorial was seen in any studied footage, but none of it is a confirmed first join."
uncertainties:
    - "Battle has no player input after the draft as seen; whether any hidden rule beyond the average score decides it is unknown."
    - "Costs and limits of Reroll, Steal, Shuffle, Reveal All and See Best."
    - "Whether a loss costs the table's cash figure."
