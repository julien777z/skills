  - 'Video: modifier cards voted by the party trade difficulty (enemy health, resistance, speed) for more event currency or drop rate (video_3 frame 024; video_2 frame 023).'
  - 'Video: weather states change damage-type effectiveness (Blizzard, Inferno, Sandstorm, Magical, Flooded, Stormy, Starfall) so teams are built for physical or magic damage (video_1 frame 015).'
  - 'Video: placing hybrid units on hills makes them hit flying enemies (video_1 captions 7:40).'
