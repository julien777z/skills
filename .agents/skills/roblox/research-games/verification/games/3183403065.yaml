transferable_ideas:
- Granting a starter unit with a full-screen rarity reveal at first control gives a new player something owned before any menu.
- A 7-day login track that escalates and caps with a draw and a luck boost ties return visits to the core gacha.
- A party vote on modifier cards that trade difficulty for more rewards gives every wave a small, readable risk choice (video_1, video_2, video_3).
- Weather that changes which damage type is strong gives players a reason to build several teams without new units (video_1).
- A bingo board of "clear each map once" goals turns a large back catalog of maps into a visible checklist (video_1).
practical_takeaway:
  strongest_idea: Give the first owned item a short, celebratory reveal the moment control starts, then badge the menu where it lives. In matches, a per-wave risk-for-reward card vote keeps repeated maps fresh and lets the group set its own difficulty.
  main_tradeoff: Four queued modals and a persistent side prompt delay the first match, and the summon screen places paid packs beside the free banner. Videos add that event chase units sit at very low odds, and veterans describe hours of grinding with no result.
  suitable_genres_and_stages:
  - Collection and gacha games
  - First-join moment of any game with an inventory
  testable_hypothesis: 'Collapsing join modals into one (or deferring the update log until after the first match) shortens time to the first match without lowering daily-login claims. Second hypothesis: offering one optional risk-for-reward card every few waves raises replays of an already-cleared map.'
  estimated_effort_and_assumptions: Estimate 1 day to reorder a join modal queue, assuming modals are already data-driven.
inferences:
- The starter unit's 300-yen placement cost suggests a placement-currency economy inside matches; not observed.
uncertainties:
- Whether a guided tutorial starts in the first match is unknown; the match was not reached.
- The first-match tutorial is still unseen; no video in the search showed a first join on the current version.
- Video_3 predates UPD 21, so its lobby layout and banners may differ from the current version.
blockers:
- Lobby world did not render in the isolated VM, so the core tower-defense loop could not be played within the sample.
