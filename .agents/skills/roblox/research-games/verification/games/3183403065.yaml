gameplay:
  advertised_loop: Summon anime-inspired heroes from banners and place them as towers to defend multiple worlds against waves of threats (description and summon-machine promo art).
  observed_loop: 'Lobby only: starter unit grant, daily login gems, unit collection and summon banners. The placement/wave loop was not reached. Video: choose a world and act (story) or event map, wait in a vote-start panel, then place units from a six-slot hotbar onto a map whose enemy path is highlighted; each placement and upgrade costs in-match yen that waves pay out; a farm unit is placed and upgraded first for income; every few waves the party votes on a modifier card; bosses arrive with "A great threat approaches..."; the match ends at a set wave (50 in Summer Hunt) with Return to lobby / Replay, then rewards feed summons in the lobby (video_1, video_2, video_3).'
  first_action: Click anywhere to dismiss the starter unit reveal.
  first_success_seconds: null
  success_feedback:
  - 'Starter unit reveal: large white unit name over a rarity label (''Rare'') with element icons on a line ornament (3183403065-2.png).'
  - Gem counter rose 150 -> 210 after claiming Day 1.
  - Red '1' notification badges on Units and Items after rewards.
  - 'Video: "Wave Completed!" green banner with a yen payout per wave and floating +N currency numbers (video_1 frame 017; video_3 frame 040).'
