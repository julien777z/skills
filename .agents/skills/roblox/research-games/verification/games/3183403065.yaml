  - 'Video: global chat broadcasts other players'' shiny pulls server-wide (video_1 frames 031-032).'
  progression:
  - Level bar at bottom 'Level 1 [0/100]'.
  - 'Collection counter ''Units: 1/100'' with a NEW!! tag and Lv. 1 on the unit card, which shows its placement cost (300 yen symbol).'
  - 'Summon banners: Summer (seasonal event units), Special (new units), Legacy; ''Your Banner Tier'', Mythic pity counter 0/400.'
  - Six empty silhouetted team slots above the level bar.
  - 'Video: per-unit upgrade panel shows current to next damage, cooldown and range with an Upgrade price in yen, a Sell value, a targeting mode button (First) and Max Upgrade at the cap (video_1 frame 028; video_3 frame 027).'
  - 'Video: trait reroll, unit fusion, evolved units, skins that buff event rewards, and tiered charms as later layers (video_3 frame 038; video_2 captions 0:20-1:30).'
  - 'Video: story worlds with six acts each and a minimum unit level, plus many event maps tracked on a Summer Bingo board (video_3 frame 014; video_1 frame 011).'
