gameplay:
    advertised_loop: "Browse catalog categories or community outfits, try items on a live avatar preview for free, save created avatars in-experience, and optionally buy items into the Roblox inventory."
    observed_loop: "Trailer only (video_1): search or browse a category -> tap TRY to wear an item on the live avatar -> optionally BUY through a Roblox purchase modal -> equip emotes from a priced/free grid -> walk around a shared map among other dressed-up avatars, and open another player's menu to view or wear their outfit. Edited, so order and frequency are the creator's, not a player's."
    first_action: null
    first_success_seconds: null
    success_feedback: []
    progression: []
    choices_and_variety:
        - "Advertised: accessories, hats, limiteds, hair combos, bundles, animation packs, emotes, faces, body; a searchable, sortable community outfit collection; item lookup by link (thumb_5)."
    social_and_cooperative:
        - "Advertised: community-created outfits browsable by others, with an upload button in the outfit browser (thumb_2), suggesting players publish outfits for others."
        - "Trailer (video_1, 0:18): tapping another player opens View Outfit and Wear Outfit, so a stranger's look can be copied onto one's own avatar in one tap; the same menu offers Send Robux, Add Friend, Kick Player and Hide User and a heart (like). Shared map of up to 24 players shown as a crowd of styled avatars (0:16)."
    companions_and_pets: []
    friction:
        - "Trailer (video_1): TRY and BUY sit side by side as equal-sized tiles on each result (0:06), and the Buy modal leads with a Robux-plus saving row, so the free try-on and the purchase are one tap apart."
        - "Search results for one query are many near-identical items with similar names (0:06), which shows breadth but makes choosing slow; inference."
