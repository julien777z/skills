transferable_ideas:
    - "Two modes on one theme: a mass race for everyone and a PvP battlegrounds for fighters, sharing the same character choice."
    - "A mount that can be recalled with one key after a fall keeps a race recoverable."
    - "A race split into short 2-3 minute stages with a graded result card and a shop break between them gives frequent rewards and natural stopping points inside one long run (video_1)."
    - "A closing fog with an on-screen countdown keeps a large field moving without a hard time limit (video_1, video_2)."
    - "Encouraging lines after setbacks ('You got this, keep going!') soften losing in a 26-player race (video_1)."
    - "A safe opening where shooting players is disabled lets the field spread out before combat (video_2)."
practical_takeaway:
    strongest_idea: "Short race stages, each ending in a graded, illustrated result card that pays cash even for last place, then a timed shop break before the next stage."
    main_tradeoff: "Combat and sabotage make placings feel unfair to whoever is targeted, and the Stand, the fan-favorite hook, barely matters in a first race; it is also built on a licensed manga's names and concepts (fan game)."
    suitable_genres_and_stages: ["Racing", "Battlegrounds fighters", "Large-lobby events", "Any round-based game with a between-round shop"]
    testable_hypothesis: "Breaking one long race into three short stages with a result card after each raises the share of players who finish a full run, compared with a single race of the same total length."
    estimated_effort_and_assumptions: "Estimate: 2-3 days for stage splits, a results card and a timed intermission in a game that already has a race track and currency; assumes the track can be cut into segments."
inferences:
    - "Very high like ratio (about 97.6%) and a young experience (created March 2026) at 20K concurrent suggest a fast-rising fan game; popularity is not evidence of its design."
    - "Video: cash rewards for every placing and praise lines for low placings suggest the game is tuned to keep losers in the run (inference)."
uncertainties:
    - "Actual race length in a full run, combat feel and monetization are unknown; the battlegrounds mode was not seen in either video."
    - "Whether a new account gets a tutorial; neither video shows a first join."
    - "What the D4C update changed; both videos predate it."
    - "Skilled-play strategy is unseen; the only guide found could not be downloaded."
blockers:
    - "Skilled-play video iocz499X5ek could not be downloaded (YouTube sign-in bot check); captions for video_2 were blocked the same way."
