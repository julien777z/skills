gameplay:
    advertised_loop: "Race on horseback for first place in 'the Bizarre Run', or fight other players with a chosen Stand (a summoned fighting spirit) in a battlegrounds mode (description)."
    observed_loop: "Video: in the lobby, pick a Stand (rolled with Arrows) and draw a rider card, press Play and queue; a cinematic opens a multi-stage race across a desert for about 26 riders. Each stage is a 2-3 minute sprint through canyons, bridges and checkpoints, managing a stamina gauge and a boost, while shooting or blowing up rivals with a sidearm and dynamite and dodging a closing fog. Between stages riders wait in a train car with a points table and a Run Shop for ammo and weapons, then ride the next stage (video_1, video_2)."
    first_action: "Video: press Play in the lobby; a card draw picks the rider before Enter Queue (video_1 1:25-1:50)."
    first_success_seconds: null
    success_feedback: ["Video: live placing ('21st', '4th') with a lasso flourish under the rider, and distance in meters (video_1, video_2)", "Video: center-screen praise lines: 'Clean Overtake!', 'You got this, keep going!', 'Atleast better than the OWNER', 'Don't worry about it' (video_1 3:15-9:00)", "Video: end-of-stage 'GREAT RACE!' card with placing, time, top speed, kills, sabotages and cash rewards (video_1 4:00, video_2 4:30)", "Video: letter grade for each stage (F after 21st, A after 13th) (video_1 4:09, 7:32 captions)"]
    progression: ["Video: cash earned per stage (+$234 and +40 for 21st in Stage 1) (video_1 4:00)", "Video: horse stats (Stamina, Acceleration, Handling, Top Speed, Boost Length) with a $500 Reroll, plus Traits and Mounts tabs (video_1 7:45)", "Video: three Stand slots, the third locked; Arrows crafted from 5 Arrow Fragments roll a Stand (video_1 1:10-1:20)", "Video: race points per stage (100 for 1st down to 30 for 10th) on a run leaderboard (video_2 4:45)"]
    choices_and_variety: ["Two advertised modes: race and battlegrounds (description)", "Choice of Stand (description)", "Secondary items chosen by holding C (description)", "Video: shortcuts and route splits that the creator calls 'only pros can do this' (video_1 3:38 captions)", "Video: Run Shop between stages sells shotgun ($500), lasso ($75), ammo ($12), shotgun ammo ($20) and dynamite (video_1 9:30)", "Video: bounty selection before a stage, picking a rival to hunt (video_1 4:27 captions)", "Video: random-feeling hazards: tornado, storm and fog (video_1 5:22-6:56)"]
    social_and_cooperative: ["Competitive race and PvP battlegrounds against other players (description)", "Like-goal codes: '150,000 LIKES FOR A CODE!' (description)", "Video: players sabotage each other with gunfire and dynamite, and a creator spends a whole stage only sabotaging (video_1 3:08, 8:06 captions)", "Video: a vote to skip the race cinematic ('Skip? (9/14)') (video_1 2:15)", "Video: spectating other racers between stages (video_1 9:15)"]
    companions_and_pets: ["A horse that can be called back with T after falling off (description)", "A Stand summoned with B (description)", "Video: Stands float beside the rider during the race (video_1, video_2); the creator never used his Stand's abilities in his first race (video_1 7:43 captions)"]
    friction:
        - "Video: being targeted by several riders at once drops a player far down the order, and the creator calls it unfair (video_1 4:06 captions)."
        - "Video: the creator ran out of ammo mid-stage and did not know how to restock until the between-stage shop (video_1 5:24, 6:22 captions)."
        - "Video: the creator only found his Stand skills on the hotbar in the second stage ('I just realized I have my skills on the floor') (video_1 6:47 captions)."
        - "Video: the Stand, the advertised hook, barely matters in the first race (video_1 7:43 captions)."
