gameplay:
  advertised_loop: "Sit at a table; on your turn type a word starting with the given letter (gallery art shows the previous word's last letter, highlighted green), with no repeated words; boosts add thinking time; the loser is launched out of the chair; global leaderboards."
  observed_loop: "From video: walk to a free round table, sit, wait for a 3 s countdown, then take turns typing a word that starts with the shown letter(s) within a per-turn timer of about 14 s; the camera turns to the active player and the word builds as large letter tiles above their head; 'Checking word...' validates it. At the start of a chain the player picks one of four offered starting letters. Missing a turn costs a heart (two hearts); the last player standing wins cash and a trophy. Between matches, players walk the hub, buy chair skins, read leaderboards and can take cash from others' tables (video_1, video_2)."
  first_action: "Video: walk to the nearest round table and sit (video_1 0:00-0:20); no tutorial appears."
  first_success_seconds: "About 40 s from the video's start: first accepted word TRAIN at video_1 0:40 (10 s frames)."
  success_feedback: ["Video: the typed word appears as big white letter tiles over the active player, then the next player's prompt carries the required letters (video_1 0:40-1:30).", "Video: winning a round raises cash and trophies in the top bar (video_2 10:00 $570/2 trophies to 11:00 $620/3).", "Video: cash amounts float above seated players' heads (video_1 5:10)."]
  progression: ["Video: cash and trophy (wins) counters in the top bar.", "Video: chair skins bought with cash on a rotating stand with rarities, e.g. Plastic Chair $350, Legendary Fire chair $10,000, 'Next skins in 00:09:14' (video_1 7:50-8:00).", "Video: Wins, Cash and Streak global boards refreshing every minute (video_1 7:40).", "Video: a limited 'Astral Chair 34/100 Left' on a WIP sign (video_1 0:00, video_2 13:00)."]
  choices_and_variety: ["Word choice is open-ended (description claims 5 million+ words); seven supported languages.", "Video: picking one of four starting letters for a chain (video_1 2:40, video_2 10:40); players in video_2 set themselves a theme (countries) for extra challenge."]
  social_and_cooperative: ["Video: 2-seat and 4-seat tables with strangers or friends; 'Invite' and 'Play Solo!' buttons on an empty seat (video_2 11:40).", "Video: a 'Steal Cash' prompt lets a player take cash from others in the hub (video_1 5:30, captions 'I just stole this cash')."]
