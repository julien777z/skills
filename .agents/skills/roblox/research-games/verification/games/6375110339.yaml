transferable_ideas:
- A five-step numbered guide card with a progress bar and a pointing arrow, tied to a previewed starter gift, makes finishing onboarding a visible goal.
- Shared team cash with a 'Team killed X +N' feed lets a weak newcomer progress inside a strong group.
- Showing every locked roster entry by name and tier previews long-term goals.
- Downed state with a short teammate-revive timer keeps a failed player in the match and gives allies a rescue goal (video_1).
- A settings panel that lets players skip repeated cutscenes and helicopter intros and switch to low-graphics mode respects returning players' time (video_3).
practical_takeaway:
  strongest_idea: Bundle onboarding into a numbered checklist with a previewed reward for finishing, and let teammates' successes pay the newcomer so early sessions feel rewarding.
  main_tradeoff: Joining a match already at wave 73 put a level-1 player into advanced waves and a raid boss in a dark arena before combat was taught; the guide taught meta menus first, and its card covered its own target. Videos add that later progression relies on long grinds and 10% drops (weeks per item per a guide creator), which favours dedicated players over casual returners.
  suitable_genres_and_stages:
  - Cooperative wave defense
  - Any game with an early meta layer (dailies, quests, roster) for first-session onboarding
  testable_hypothesis: A numbered 4-5 step guide with a previewed starter reward raises the share of new players who reach their first combat action compared with no guide.
  estimated_effort_and_assumptions: Estimate 2-3 days for a guide-card component and step triggers, assuming existing reward granting and a UI framework.
inferences:
- The guide's order (daily reward, quests, then combat) suggests the game prioritises return systems in the first session.
- Placing new players into an in-progress endless run may be intended to keep matches full; its effect on new-player retention is unknown.
uncertainties:
- No own kill was confirmed, so the combat feel, skill keys beyond E, and guide step 5 were not experienced.
- Whether HP recovery at wave 75 was a respawn or a heal was not seen.
- Audio was not captured.
- Videos are edited; none shows a first join, so onboarding duration and the guide in real play cannot be compared to an uncut new-player video.
- Settings were seen on Ver. 7.3.0; whether all of them remain in 9.4.2 is unknown.
