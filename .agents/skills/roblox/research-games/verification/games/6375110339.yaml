gameplay:
  advertised_loop: 'Deploy units and Titans to defend a base against escalating waves of enemies (description: ''wave tower defense and survival shooter''); move keys Q E R T Y F G H Z X C V B and double-space with keystack and aerial variants.'
  observed_loop: Pick a mode in a lobby, teleport into a shared endless-mode match, choose an owned character in a roster panel, press Ready to spawn at the next wave, then fight the toilet-army wave in third person with M1 and an E skill; the team's kills pay shared cash into every player's counter and each cleared wave pays points. A raid boss (health bar with segment ticks) appeared at wave 75.
  first_action: Click 'Skip Loading' on the custom loading screen, then 'Play' on the title screen.
  first_success_seconds: null
  success_feedback:
  - 'Kill feed at bottom-left: ''Team killed <enemy> +N Cash'' lines in white with yellow cash amounts (6375110339-17.png).'
  - Cash counter ticked up from team kills (561 -> 878 -> 1.0k -> 1.8k) without the player landing a kill.
  - Points +30 per wave cleared (300 -> 330 -> 360).
  - Daily login card flips to a green 'CLAIMED' stamp with '+300 P' floating text (6375110339-10.png).
  - 'Video: floating damage numbers and an on-screen HITS combo counter with total DMG during combat (video_1 frames 004, 008-011).'
  - 'Video: boss health shown as a large name-labelled bar at screen bottom for raid bosses, and per-enemy numeric HP bars over bodies (video_3 frames 013-016; video_1 frames 007-011).'
  progression:
  - Character roster of 21 categories (Camera, Speaker, TV, Clock, Drill, ...) with tiers 1-4 and per-character Mastery levels and 48 skins; most entries LOCKED (6375110339-13.png).
  - Separate Titans tab in the roster.
  - Player level bar under HP (LV 1); mastery XP drives the 'Training Day' daily quest.
  - 'Video: currency from endless mode scales with waves survived; the guide route is buy Plunger Man (2000), Titan Cameraman (1500), Camera Woman (1000), then a special-Titan quest chain (UTCM: six flash drives at 10% drop plus a key card and four quest pages; UTSM rescue needs EPD-gun teammates) (video_2 0:35-2:10).'
  - 'Video: many quests and character perks require a character at mastery level 80; the top Titan quest needs four characters at 80 (video_2 2:40-3:20).'
  - 'Video: per-character quests show progress bars such as "Time Played 2722/9000 sec" and "Beat Wave Boss 5/10" with a SKIP QUEST option (video_1 frame 012).'
  - 'Video: units can be bought with points (1250) or Robux (250) on the same confirmation (video_1 frame 005).'
  choices_and_variety:
  - 'Lobby modes: Classic gamemode, Private Room, CCTV Base mode (marked Experimental), Campaign (struck through ''NOT RELEASED YET''); Classic splits into Default (endless, 90 waves) and Casual (difficulty/challenge mode) (6375110339-4.png, 6375110339-5.png).'
  - Character choice limited to the one owned starter in this sample.
  - 'Video: playable characters carry 4-6 named skills on letter keys (Skill Q Dash, Y Declaration, G Equip Plunger, R Plunger Throw, E Drop Kick), listed beside the roster (video_1 frame 003).'
  - 'Video: modes shown include Default (endless, 90 waves), Casual (difficulty/challenge), Boss Rush and Hell Wave (video_1 frame 038; video_2 1:59, 3:40).'
  social_and_cooperative:
  - Player list shows each player's character, level and state (IN WAVE / SPECTATING).
  - Join-by-friend-name field in the lobby (not used).
  - Shared team cash and team kill feed make other players' progress visible.
  - 'Video: a downed player shows a Revive prompt with a 32 s timer and a progress bar for teammates (video_1 frame 034).'
  - 'Video: some quests need teammates with specific gear (video_2 1:40); developers note there is no PvP (video_3 captions 3:20).'
  companions_and_pets: []
  friction:
  - Joined an in-progress match at wave 73 as a tier-1, level-1 character, so the first combat was an advanced wave and then a raid boss rather than a teaching wave.
  - Spawn area and arena were very dark; enemies were hard to see and locate (6375110339-18.png, 6375110339-21.png).
  - Guide step 3 card sat on top of the 'Press here or [,] to change characters' button it pointed to (6375110339-12.png); keyboard ',' was needed.
  - Guide step 2 highlight box rendered empty while the Quests panel was open, and the Quests panel's close button was hidden under the player list (6375110339-11.png).
