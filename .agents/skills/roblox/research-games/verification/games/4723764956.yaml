gameplay:
    advertised_loop: "Author a short movie from avatars, pictures, text (speech bubbles) and sounds, publish it, then watch an endless feed of other players' movies and react (views and likes are advertised)."
    observed_loop: "From videos, not play: players gather in a 3D cinema lobby, take seats and open Create, which switches to a full-screen 2D editor. Each movie is a strip of slides: on each slide players search a picture library (backgrounds, props, memes, stickers), add Roblox avatars (their own or others in the server), set poses and emotions, type speech text, add sounds, then add or copy a slide and change it; an animation option moves a character across the stage between slides. Several players in one server can edit the same movie at once (Invite button). Publish shows 'Good work on your movie!', and the movie then plays on the lobby's big screen with the creator's name and a 'GRAND PREMIERE!' or 'PLAYED NEXT' tag while others Comment or Like (video_session_1 0:30-9:00; video_session_2 0:32-9:30)."
    first_action: "Video: from the lobby, take a seat or press Create, then open Pictures to place a background (video_session_1 0:28-0:50; video_session_2 0:25-0:40)"
    first_success_seconds: null
    success_feedback: ["Advertised: view and like counters on a published video (thumbnail_1).", "Video: 'Good work on your movie!' dialog on publish, naming a newly unlocked tool ('You just unlocked Timings!'), 'Your movie will play on the big screen soon.', and three next steps: Make more!, Watch movies!, Back to theater (video_session_1 6:50, frame DYGgfJPZkDM-028).", "Video: the published movie plays on the cinema screen in front of everyone in the server with the creator's name and a 'GRAND PREMIERE!' tag (video_session_1 7:20-9:00).", "Video: ticket balance rose from 460 to 610 across the publish (video_session_1 0:00 vs 6:50); the cause of the increase is inferred, not shown."]
    progression: ["Inferred from passes: creation limits (images, characters, movie length, speech length) appear to be the expandable resource.", "Video: editor features unlock by use; the first publish unlocked 'Timings' (video_session_1 6:50).", "Video: pose categories (General 2, Creepy, Dances, Exercise, Fighting, Glitch and more) show lock icons and 'Buy 1,100' ticket prices, so tickets earned in game buy pose packs (video_session_2 9:00)."]
    choices_and_variety: ["Advertised: four content types (avatars, pictures, text, sound) combined freely.", "Video: the picture search returns a very wide library, including memes and stock photos, plus a background library grouped by room (bedroom, living room, lunchroom, the game's own lobby) and animated stickers (video_session_1 0:30; video_session_2 8:30).", "Video: avatars take poses and emotions from a categorized library and can be animated across the stage (video_session_1 1:18-2:05; video_session_2 9:00)."]
    social_and_cooperative: ["Advertised asynchronous audience: players watch each other's videos; a report flow exists for rule-breaking videos.", "Video: synchronous co-creation; several players in one server place their avatars and edit the same movie together, and the cinema screen gives a shared watch party with Comment and Like (video_session_1 1:09-1:30, 7:20; video_session_2 1:14-3:10)."]
    companions_and_pets: []
    friction: ["Description must explain how to report videos, which suggests moderation of user content is a live concern.", "Video: a newcomer said 'How does this game work? I am confused' and was taught by another player rather than by the game (video_session_1 0:31).", "Video: copy and paste was not discoverable ('how do you copy and paste it?') (video_session_2 2:19).", "Video: in a shared movie one player's added pictures cluttered the scene and the others cleared everything (video_session_2 3:03-3:13).", "Video: text entry is a full-screen dimmed modal with OK/Cancel that hides the scene being captioned (video_session_2 2:00, 2:30)."]
