gameplay:
    advertised_loop: "Sweep moon dust tile by tile into a canister, empty it at the base for cash, upgrade brush, canister and speed, then drive sweepers and rovers and build robots, belts and machines; up to 4 friends; goal is a 100% clean Moon."
    observed_loop: "Lobby pad matchmaking into a party moon, a first-person toothbrush tool and a first quest to sweep 1 kg of dust; the sweep itself was not achieved."
    video_observed_loop: "Videos show the loop the runner could not perform: hold left mouse to scrub white dust into a gray path, fill a small canister (1 kg, then 2.5 kg), walk back along a floor line to the Deposit for a few dollars, buy a wider brush at the tool shop and canister/payout levels at the Upgrade computer, and earn a +$4 bonus for each tile cleaned to 95%; later money goes to belts, robot docks and vehicles (yt_onboarding_1 1:15-9:45; yt_skilled_1 0:52-6:30)."
    first_action: "Step onto a lobby Play pad to start or join a moon."
    first_success_seconds: null
    video_first_success: "First dust collected within about 15 s of arriving on the moon and first deposit (and $1 Scrubber purchase) about 30 s after arrival, measured on yt_onboarding_1's continuous clock (1:15 arrival, 1:30 sweeping, 1:45 tool shop)."
    success_feedback:
        - "Video: the scrubbed path turns from white dust to gray ground under the brush; canister meter fills; 'Deposit: 2.5 kg +$2' toast; live tile % in the quest banner and a moon-cleared % at top right (yt_skilled_1 1:44-5:00)."
        - "Video: green completion banner with a check mark ('You know the loop', 'Buy a new brush - Done') (yt_skilled_1 1:18, 5:12)."
    progression:
        - "HUD canister meter (0.00 / 1 kg) and cash ($0) show the collect-and-deposit economy."
        - "Base board titled 'Never fill again' listing 'Sell as you sweep' and 'Infinite canister' upgrades with a Deposit station."
        - "Hotbar slot 2 holds a second tool (flashlight-like, not used)."
        - "Video: tool shop brush ladder Toothbrush > Scrubber ($1-$3) > Dustpan Brush > Broom, each wider (yt_onboarding_1 1:45)."
        - "Video: Upgrade computer radial tree with leveled Canister, Payout, Head width, Head power, Tile bonus and Walk speed (yt_skilled_1 1:31)."
        - "Video: lobby Shard shop of permanent bonuses carried into every moon, and Classes (yt_skilled_1 0:13)."
        - "Video: Build menu of belts, splitters, robot docks, mite hives, crushers and block presses (yt_skilled_1 5:38-6:30)."
    choices_and_variety:
        - "Lobby: start a new moon or join another player's pad; leader chooses party size."
    social_and_cooperative:
        - "Parties of up to 4 on lobby pads; first player on a pad becomes leader and holds the save file."
        - "Lobby leaderboard ranks players by two columns of values."
    companions_and_pets: []
    friction:
        - "Walking onto a pad silently joined a stranger's party; a 'Leave pad' button is the only control."
        - "When the leader left, a red 'Leader left - game not saving' banner appeared and progress in that moon would not save for the remaining player."
        - "First quest gives no on-screen pointer from the base to the dust beyond a compass marker with distance."
        - "Video: stepping onto a lobby pad put the video player straight into another crew's 0.8%-clean moon, as in play_1 (yt_onboarding_1 0:30)."
        - "Video: early canister holds only 1-2.5 kg, so the first minutes alternate about 30-45 s of scrubbing with a walk back to the deposit (yt_onboarding_1 1:30-5:00); the 99 Robux 'Infinite Canister' widget sits beside this from arrival (inference that it targets this friction)."
