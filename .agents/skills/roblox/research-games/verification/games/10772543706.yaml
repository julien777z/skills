transferable_ideas:
    - "Absurdly weak starter tool (a toothbrush) as a visible promise of upgrades."
    - "Quest banner that combines the goal, a live amount counter, the exact input glyph and a Skip button."
    - "Keycap badge on every HUD button so keyboard shortcuts teach themselves."
    - "Lobby pads that turn party formation into walking onto a physical pad, with screens showing the count and leader."
    - "Let the play surface record progress: what the player cleaned stays visibly different, so the world is the progress bar (yt_onboarding_1, yt_skilled_1)."
    - "Close the guided chain with a 'What's next' card of three pictured goals and one Close button instead of further forced steps (yt_onboarding_1 5:15)."
    - "Give a cheap first purchase within the first minute (a $1 wider brush) so the earn-spend-upgrade cycle completes before the player can get bored (yt_onboarding_1 1:45)."
practical_takeaway:
    strongest_idea: "A one-banner quest chain that walks a new player through one full earn, deposit, buy and upgrade cycle in about four minutes, with the cleaned ground itself showing progress, and ends on a pictured 'What's next' choice."
    main_tradeoff: "Leader-owned save files mean a stranger leaving stops a joined player's progress from saving, and joining a pad can put a new player into someone else's moon without a choice."
    suitable_genres_and_stages: ["incremental simulator", "collection loops", "co-op", "first session"]
    testable_hypothesis: "A first purchase priced to be affordable after the first deposit, plus a 'What's next' card at the end of guided steps, raises the share of new players who reach their second upgrade."
    estimated_effort_and_assumptions: "Small (under a day) for the banner if quests already track amounts; assumes an existing HUD component."
inferences:
    - "Up-and-Coming rank and 4.1 M visits within about 16 days of creation suggest the toothbrush-to-rover upgrade fantasy and the 'Inspired by Moon Sweepers' framing travel well."
uncertainties:
    - "Sweep feel on a real device was seen only in video; play_1 could not perform the sweep."
    - "Captions were unavailable for both videos (HTTP 429); the onboarding video is low-view (929) and from a 37.5k channel, because high-view results for this name mostly show the Steam game Moon Sweepers (one such pick, r7WcKpm9EY4, was discarded on inspection)."
    - "Whether a solo moon starts when a pad is empty was not verified."
    - "Whether the account was fresh to this game is unknown."
blockers:
    - "Runner input: the published client did not register synthetic held left-mouse input as tool use, so the core sweep loop could not be played."
