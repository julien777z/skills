gameplay:
    advertised_loop: "Clear a short parkour stage, touch its checkpoint, shrink, repeat for 142 stages; small players can be picked up by players more than twice their size."
    observed_loop: "Spawn on a white strip facing a single white cube whose faces carry diagonal chains of small red steps, yellow pads and large green blocks over a red floor. Stepping onto the red floor drops the avatar through it into a long fall and respawn; touching the step chain or the 'Stage 50 Required' pad at the wall base also returned this avatar to spawn. Other new players in the server advanced fast (one went from stage 1 to 31 in about seven minutes, another from 0 to 14 in about three) while this session stayed at stage 0. Video (video_1, video_3): the whole obby is one white cube and every stage is a route over it at a finer scale. At stage 0 the route is the grey stepped blocks on the cube's right edge up to the white slab on top (stage 1 at 0:07); after each checkpoint the avatar is smaller, so the same cube's finer features become the next platforms: the small red step chains with yellow rest blocks across the faces, green blocks as checkpoints, then (from stage 56) a doorway at the base of the wall gated by a 'Stage 56 Required' pad that leads into coloured interior rooms (blue, magenta, cyan) where tiny gaps become routes. In video_1 the avatar stands and climbs on red steps throughout, so red steps are safe; the red floor is the hazard."
    first_action: "Walk forward from spawn toward the course cube."
    first_success_seconds: 7
    success_feedback:
        - "Video: at each checkpoint a ring of multicoloured confetti circles the avatar with a decimal number in it (for example 1.25 and 0.7) and the top-centre stage counter increments (video_1 0:07, video_2 5:45). Inference: the number is the new size."
        - "Video: the camera does not zoom in as the avatar shrinks, so the world, other players and the cube grow on screen stage by stage; that growth is the visible reward (video_1 0:00-9:45)."
    progression:
        - "Observed: a top-centre stage counter flanked by '< < <' and '> > >' arrows (7729422550-1.png); clicking '>' at stage 0 did nothing."
        - "Observed: world leaderboards at spawn for 'Best Players' (top entries 142-154 stages), 'Richest People' and 'Most Dedicated Players' (play time), each 'Updating in N' seconds (7729422550-3.png, 7729422550-4.png)."
        - "Observed: a 'Stage 50 Required' pad at the base of the wall, a gate to a later area (7729422550-33.png). Video frames read it at close range as 'Stage 56 Required', in front of a small doorway into the cube (video_1 7:45, 8:45); the play capture read the small text from a distance."
        - "Video: a competent player reached stage 56 within about 10 minutes from stage 0 (video_1); the guide creator said stages to 141 took about 19 hours in total (video_3 2:45, on-screen caption)."
        - "Video: later stages move inside the cube into saturated single-colour rooms (blue, magenta, cyan, purple) with red floors, a visible change of setting past stage 56 (video_2 14:30, video_3)."
        - "Video: further gate pads ('Stage 128 Required' at stage 127) recur inside (video_3 1:00)."
    choices_and_variety:
        - "Observed: two step routes up the cube's front, one rising left and one rising right (7729422550-44.png)."
    social_and_cooperative:
        - "Observed: an 'E Pick Up' prompt appeared over a much smaller nearby player (7729422550-17.png); not used."
        - "Observed: a 'Hide Players' toggle in settings (7729422550-41.png)."
    companions_and_pets: []
    friction:
        - "Observed: no on-screen instruction at spawn on where stage 1 begins or which colours are safe; the only text near the course is the 'Stage 50 Required' pad."
        - "Observed: the red floor reads as a floor but is non-collidable; walking onto it causes a fall of more than ten seconds before respawn (7729422550-13.png, 7729422550-50.png, 7729422550-51.png), shortened by the R reset key."
        - "Observed: the gated pad sits at the base of the wall between the two routes, where a new player naturally walks."
        - "Video and play disagree on where stage 1 is: in play (play_1) the avatar tried the step chains and the gate pad and stayed at stage 0; in video_1 the stage 1 route is the grey block steps on the right edge of the cube to its top slab, done in 7 s. Nothing in the world marks that route; the step chains that look like the course are sized for later, smaller stages (inference)."
        - "Video: late stages are hard enough that a guide video exists for six of them and its creator calls stage 127 a wrap through a tight gap (video_3 1:15-1:45)."
    evidence: [play_1, description_1, thumbnail_1, video_1, video_2, video_3]
