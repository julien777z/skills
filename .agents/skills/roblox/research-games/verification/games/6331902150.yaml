transferable_ideas:
    - "A persistent objective panel with a counter ('Setup Generators ... (2/5)') plus one big round timer keeps every player's next goal on screen during chaos (video_2, video_3)."
    - "Every scoring action prints a one-line reward with its source ('+ $4 & 12 EXP: Hit Survivor with Nova'), teaching which actions matter while rewarding them (video_1, video_3)."
    - "A dramatic 'This round's killer is...' reveal card turns role assignment into a moment (video_3 1:15)."
    - "Ability buttons that show key, icon, name and a cooldown number in one circle (video_3 7:30)."
    - "A two-line role brief (what survivors do, what the killer does) states the whole round goal and its end condition; a short round with a visible countdown gives a natural stopping point."
    - "A comfort warning (flashing lights, loud audio) placed first in the description, with separate music and SFX volume in settings."
practical_takeaway:
    strongest_idea: "Short rounds (about four minutes) with an always-visible objective counter and a text reward feed: each player knows the goal, the time left and what just earned them progress."
    main_tradeoff: "Depth lives in a large roster of abilities and hidden timings; near-newcomers flounder and die early, then spectate, and a Robux 'Killer Chance' lets payers jump the role queue."
    suitable_genres_and_stages: ["round-based multiplayer", "survival/horror", "party games", "any round HUD"]
    testable_hypothesis: "If each scoring action shows a one-line reward naming the action, new players repeat the rewarded action (e.g. generator repair) more often in their first three rounds than with a silent score."
    estimated_effort_and_assumptions: "Estimate: a day or two for a reward feed and objective counter, assuming the round and scoring events already exist."
inferences:
    - "Nearly 6 billion visits and 108k concurrent players make this by far the largest game in this assignment; popularity is correlation, not proof that any feature causes it."
    - "Only one badge (first play) suggests progression is not tracked through badges; videos show it lives in per-character levels, skins and achievements instead."
    - "Malice-based killer selection plus a Robux 'Killer Chance' suggests the killer role is the scarce, desired role (inference from video_1 and video_3 captions)."
uncertainties:
