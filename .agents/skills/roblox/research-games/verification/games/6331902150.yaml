gameplay:
    advertised_loop: "Each round, players are split into one killer and several survivors; survivors complete objectives and protect each other until a countdown reaches zero, while the killer hunts to eliminate everyone before it does."
    observed_loop: "Lobby with a 'Round begins in' countdown -> 'This round's killer is...' reveal card -> survivors spawn on one of many themed maps and repair generators by solving a short puzzle at each ('Setup Generators ... (2/5) Survive until the timer runs out'), loop the killer with sprint, and use a character's two abilities (stun slash, block, sentry, heal, trip mine) and items (soda, chicken, medkit) to escape or help teammates; the killer uses four or five cooldown abilities to hit and kill survivors. The round ends when the 'Round ends in' timer reaches 0 (survivors win) or every survivor is dead; players return to the lobby and the next killer is chosen by accumulated 'Malice'. (video_1, video_2, video_3)"
    first_action: "From the lobby, wait out the 'Round begins in' timer; in round, survivors run from the killer or walk to a generator (video_1 0:30-0:45)."
    first_success_seconds: null
    success_feedback:
        - "Every scoring action prints a line at top centre with its money and EXP value, e.g. '+ $10 & 117 EXP: Killed a Survivor', '+ $4 & 31.2 EXP: Hit Survivor with Hunter's Feast', '+ $5 & 16.5 EXP & 0.75 Malice: Punched Killer as Guest 1337' (video_1 4:00, video_3 1:45, 7:30)."
        - "Level-up toast with the character portrait: 'Azure Leveled Up! Level 90 -> Level 91' (video_1 7:45)."
        - "End-of-round card with time played and a large 'Survivor Wins' tally (video_1 0:15)."
        - "Each character and killer has a loud chase theme; players cite the music as a highlight (video_3 captions 7:10)."
    progression:
        - "Per-character levels and EXP (level-up toast) and money from scored actions (video_1 7:45)."
        - "Money buys skins, emotes and items in a Shop; character 'milestone' skins mark long play with one character (video_1 8:15, video_3 captions 4:40, 6:50)."
        - "'Malice' accumulates per round and decides who becomes killer; lobby leaderboard lists each player's Money and Malice (video_1 3:00)."
    choices_and_variety:
        - "A roster of named survivors (Noob, Elliot, Shedletsky, Guest 1337, Builderman, Two Time, Veeronica, Taph, 007n7, Chance) and killers (c00lkidd, Noli, John Doe, Jane Doe, Slasher, 1x1x1x1), each with distinct abilities; survivors fall into roles such as Sentinel (can stun), support (heal, sentry) (video_1, video_2, video_3)."
        - "Many themed maps, including a pizza place, Roblox HQ, a natural-disaster island and a winter town (video_1 4:51, 8:30, video_2)."
    social_and_cooperative:
        - "Survivors body-block, stun the killer off a teammate, heal each other (Elliot), and stack abilities, e.g. a trip mine next to a sentry (video_2 captions, video_3 2:46-3:30)."
        - "Lobby 'Invite Friends (+10% EXP)' button rewards bringing friends (video_1 0:30)."
    companions_and_pets: []
    friction:
        - "Steep ability knowledge: a near-newcomer slashes too early, runs into walls and asks 'can you vault windows?', 'how do you crouch?' (video_1 0:40-4:05); a returning player cannot tell who is who because 'these skins have gotten out of hand' (video_3 7:50)."
        - "Losing a chase as a survivor means death for the rest of the round; dead players spectate (video_1 2:10, 4:31)."
        - "Expert counterplay depends on hidden timings and audio cues (e.g. stun at the last moment of an ability by its sound) (video_2 captions 0:30-1:30)."
    evidence: [description_1, thumbnail_1, video_1, video_2, video_3]
