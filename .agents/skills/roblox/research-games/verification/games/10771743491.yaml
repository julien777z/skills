gameplay:
  advertised_loop: "Wake in a locked school basement, evade one hunter ('HE is hunting you') while staying quiet ('Don't make a sound'), and escape the school."
  observed_loop: "Pick a starter kid and a difficulty on the bus -> read four rule cards -> clear the basement exit (find crowbar, pry 5 boards) -> search lockers across the dark school for 4 coloured keys while Cartman hunts by sound, hiding in lockers and using found items (traps, alarm clock, fried chicken lure, batteries) -> place each key in the basement exit door -> the door jams, find the crank parts and crank 5 times -> escape. Death costs a life; losing all lives ends the run, with spectating or a paid revive. (video_1, video_2, video_3)"
  first_action: "Read rule cards, then find a crowbar in the basement and press E on the boards ('Now go to the BOARDS and press E to pull them off.') (video_1 0:28-1:00, video_2 0:15-1:00)."
  first_success_seconds: 81
  success_feedback:
    - "Short centred captions for each pickup and step: 'You found $10', 'You found a trap! Take it out (5), aim at the floor and click', 'You got a KEY! Take it to the EXIT DOOR in the basement - it GLOWS. If Cartman gets you, you DROP it.', 'The exit door is open. Get out!' (video_1 2:15, video_2 2:30, 9:30)."
    - "Floating '+$15 from a locker' money pop-ups at the right (video_2 3:00)."
    - "Objective checklist ticks and counters update ('Pry the boards off 0/5', 'Find the keys 0/4') (video_1 1:00)."
    - "Badge toast on first death/escape events (video_3 5:00)."
  progression:
    - "Cash found in lockers buys locked characters ($750-$3000) and revives; starter kid is free (video_3 0:30, video_1 28:19)."
    - "Two-part story with Part 2 'coming soon'; Daily Tasks button in lobby (video_3 0:45)."
    - "Within a run: boards -> 4 keys -> crank parts -> escape (video_2)."
  choices_and_variety:
    - "Character picker with stat bars (Speed, Stamina, Stealth, Courage, Intelligence) per kid (video_3 0:30)."
    - "Four difficulties: Easy (4 lives, 12 min flashlight, Cartman x0.88), Medium (3 lives, 9 min, x1.00), Hard (2 lives, 5.5 min, x1.08), Authoritah (1 life, 3.5 min, x1.16) (video_3 0:45)."
    - "Extra tasks beside the main objective: 'Find Ike's rubber duck', 'Answer the phone when it rings', 'Search 12 lockers together', 'Ring 3 school bells' (video_1 1:00, video_2 9:00)."
    - "Distraction items: fried chicken thrown as a lure, alarm clock, bear traps (video_1 2:15, 5:30, captions 12:30)."
  social_and_cooperative:
    - "Co-op run with friends; a 'Search 12 lockers together' extra task; 'He can hear your mic' makes voice chat a stealth risk (video_1 0:00, video_2 9:00, video_3 1:23)."
    - "Dead players can spectate the hunter or return to the lobby; 'This round carries on without you' (video_1 captions 18:40)."
  companions_and_pets: []
  friction:
    - "Very dark; the flashlight battery runs out and a dark meter raises insanity (video_1 captions 13:00, 17:30; video_2 9:00)."
    - "Loud scripted jump scares; the onboarding player removes a headphone to cope (video_1 captions 3:30, 9:00)."
    - "Unclear sub-goals: 'How do I find the crank parts? It doesn't even give me like a hint' (video_1 captions 17:40); 'Where's the silver key go?' (13:20)."
    - "Running is loud and has a start delay; the player cannot tell why he cannot run (video_1 captions 8:02)."
    - "Pry-the-boards animation cannot be skipped (video_1 captions 1:05)."
  evidence: [source_1, source_2, source_3, source_4, video_1, video_2, video_3]
