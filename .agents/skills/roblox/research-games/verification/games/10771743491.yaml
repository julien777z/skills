transferable_ideas:
  - "Four picture cards before the first run, each three images plus one sentence and the keys to press, with 'Never show again': all rules in about 25 s (video_1, video_3)."
  - "Teach each item the moment it is picked up with a one-line caption that says what to do with it (video_1 2:15, 5:30)."
  - "Difficulty as one card row with concrete numbers (lives, flashlight minutes, hunter speed), chosen by the host (video_3 0:45)."
  - "A rescue hint after a stall ('a locker with a key JINGLES now') turns being stuck into a listening task instead of a wiki search (video_2 9:45)."
  - "State the whole loop as a three-word goal plus a four-word rule on the title card ('Escape the school.' / 'Don't make a sound.'), so the page teaches the game before the player joins (from thumbnails)."
  - "Lit signs naming rooms inside a dark map give a navigable landmark system without HUD markers (from promotional renders, confirmed in videos with 'NURSE' and 'LOCKER ROOM' signs)."
practical_takeaway:
  strongest_idea: "A 25-second picture-card briefing plus a one-minute guided first task, then just-in-time item captions: a new player reaches independent play in under 90 s and learns each tool when it first appears."
  main_tradeoff: "Darkness, tiny text and loud scares are the product but hurt readability and comfort; a later sub-goal (crank parts) gives no hint; the game leans on a recognisable TV cartoon's characters, a brand and moderation risk."
  suitable_genres_and_stages: ["horror and stealth escapes", "any game with several tools to learn", "first-session onboarding"]
  testable_hypothesis: "Showing a one-line use caption the first time each item is picked up raises the share of new players who use that item in their first run, compared with listing all items on an intro card."
  estimated_effort_and_assumptions: "Estimate: a day for first-pickup captions, assuming an item system with pickup events and a caption UI."
inferences:
  - "Reaching 9.6 million visits and 15k concurrent within about three weeks of release suggests strong pull from the parody-horror premise; large creators reacted to it within days (videos uploaded 2026-11-01 to 2026-11-09). Passive material cannot establish why it is popular."
  - "The hunter is the cartoon character Cartman, named in the game's own text; the kids are named after the same show (video_1, video_3)."
  - "Escape takes about 9-18 minutes on medium for a first-timer versus about 9.5 minutes for a route-knowing player (video_1 captions, video_2); one run each, not typical session length."
uncertainties:
  - "The join, loading time and lobby of the first-play video are cut; video_3 shows the lobby for returning-style players who already know where to go."
  - "What 'Gotcha, Hippie', 'Untouchable' and 'Nothing But Net' reward is not stated."
  - "Badge counts start on 2026-10-29, eleven days after release, so they undercount early players; the escape ratio is only indicative."
  - "Whether the night-vision pass changes play materially is unknown; the key list shows an N binding for it."
  - "Whether servers ever pair strangers into one run beyond the bus is unclear; video_3 shows a stranger on the bus."
