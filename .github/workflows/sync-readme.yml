name: Sync README

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/scripts/render_readme_skills.py"
  workflow_run:
    workflows: ["Agent Sync"]
    types: [completed]
    branches: [main]

concurrency:
  group: sync-readme-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    name: Render the skill listing
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - run: python3 .github/scripts/render_readme_skills.py --commit-to "$BRANCH"
