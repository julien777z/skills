name: Sync README

on:
  workflow_run:
    workflows: ["Agent Sync"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - ".agents/skills/**"
      - "README.md"
      - ".github/scripts/render_readme_skills.py"
      - ".github/workflows/sync-readme.yml"

concurrency:
  group: sync-readme-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check the skill listing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/render_readme_skills.py --check

  render:
    name: Render the skill listing
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - run: python3 .github/scripts/render_readme_skills.py --commit-to "$BRANCH"
