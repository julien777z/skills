name: README Skills

on:
  push:
    branches: [main, master]
    paths:
      - ".agents/skills/**"
      - ".github/scripts/render_readme_skills.py"
      - ".github/workflows/readme-skills.yml"
  pull_request:
    paths:
      - ".agents/skills/**"
      - "README.md"
      - ".github/scripts/render_readme_skills.py"
      - ".github/workflows/readme-skills.yml"

concurrency:
  group: readme-skills-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    name: Render the skill listing
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Check the listing matches the skills
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/render_readme_skills.py --check

      - name: Render and commit the listing
        if: github.event_name == 'push'
        run: python3 .github/scripts/render_readme_skills.py --commit-to "${{ github.ref_name }}"
