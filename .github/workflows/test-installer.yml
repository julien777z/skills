name: Test Installer

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - ".agents/hooks/**"
      - ".agents/skills/workspace/agent-lock/resources/**"
      - ".github/scripts/test-installer.sh"
      - ".github/workflows/test-installer.yml"
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash .github/scripts/test-installer.sh
