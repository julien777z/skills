name: Test Installer

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - ".agents/hooks/**"
      - ".agents/skills/workspace/agent-lock/resources/**"
      - ".github/scripts/test-installer.sh"
      - ".github/workflows/test-installer.yml"
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo env "PATH=$PATH" bash .github/scripts/test-installer.sh
