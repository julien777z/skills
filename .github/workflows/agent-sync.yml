name: Agent Sync

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".agents/**"
      - ".github/workflows/agent-sync.yml"
  schedule:
    - cron: "0 6 * * 5"

concurrency:
  group: agent-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    name: Sync agent files
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julien777z/agent-sync-action@be8a699a2e0d470dcbaac64eacd225837deda2fb
        with:
          output-dir: .agents/.auto_generated
          refresh-external-skills: ${{ github.event_name == 'schedule' }}
